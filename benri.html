<!doctype html>
<html lang="ja" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>便利ツール｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 便利ツール（2026/11/01 ユーザー）。ツールはここにカードで足していく */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.06em}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
.brandrow .back{display:grid;justify-items:center;align-content:center;flex:none;min-width:44px;height:46px;margin:-4px -2px -4px -8px;border-radius:10px;
  background:rgba(255,255,255,.16);line-height:1;padding:0 5px 3px}
.brandrow .back b{font-size:26px;font-weight:400;line-height:.9}
.brandrow .back .backlbl{font-size:10.5px;font-weight:700;letter-spacing:.06em}
a.brandrow:active .back{background:rgba(255,255,255,.3)}
main{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:16px 14px;text-decoration:none;color:inherit;min-height:120px}
a.card:active{transform:scale(.98)}
.card .ic{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{font-size:17px}
.card span{font-size:12.5px;color:var(--muted);line-height:1.45}
.note{font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brandrow" href="./" aria-label="メニューにもどる"><span class="back" aria-hidden="true"><b>‹</b><span class="backlbl">TOP</span></span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">便利ツール<small>株式会社コウケン</small></div></a>
</div></header>
<main>
  <div class="grid">
    <a class="card" href="ikei-tee.html">
      <span class="ic"><svg viewBox="0 0 28 28"><rect x="3" y="15" width="22" height="8" rx="1.5"/><rect x="10" y="4" width="8" height="11"/><path d="M10 15q4 3 8 0"/></svg></span>
      <b>異形チーズ</b>
      <span>枝管の切り口の寸法（8等分）</span>
    </a>
  </div>
  <p class="note">ほかのツールはこれから増やします。</p>
</main>
</body>
</html>
