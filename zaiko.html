<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>工場在庫｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 携帯1画面のアプリ：上にだれが入力するか、まん中に材料の一覧、下にタブ。色と文字は原田さんの勤怠台帳（コウケン管理簿）に合わせる */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --low:#b0322d; --low-soft:#fbdfdd; --in:#0d7a52; --in-soft:#d8f0e6; --out:#93650d; --out-soft:#fbeecd;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --in:#3fbe8b; --in-soft:#0e3527; --out:#d6a341; --out-soft:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --in:#3fbe8b; --in-soft:#0e3527; --out:#d6a341; --out-soft:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
.nolow .lowonly{display:none!important}
/* 続けてタップしても拡大しない（＋−を何回も押すため）。2本指で広げる拡大はそのまま使える */
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  margin:0;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 上の青い帯：原田さんの勤怠台帳と同じ形（青地・白い文字・白い角丸の中にロゴ） */
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
/* 戻る「‹」：指で押しやすいよう、幅と高さのある四角にする（2026/10/28 ユーザー） */
.brandrow .back{display:grid;place-items:center;flex:none;width:40px;height:44px;margin:-4px -2px -4px -8px;border-radius:10px;
  background:rgba(255,255,255,.16);font-size:32px;line-height:1;font-weight:400;padding-bottom:4px}
a.brandrow:active .back{background:rgba(255,255,255,.3)}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.14em}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:inherit;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 12px;font-size:13px;max-width:50%}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.who b{opacity:.78;font-weight:400;font-size:11px;flex:none}
.banner{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--out-soft);color:var(--ink);font-size:14px}
main{display:grid;gap:16px;padding-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.alert{padding:12px 14px;display:grid;gap:8px}
.alert h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.alert.has{border-color:var(--low);background:var(--low-soft)}
.alert.has h2{color:var(--low)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--in);flex:none}
.alert.has .dot{background:var(--low)}
.lowlist{display:flex;flex-wrap:wrap;gap:6px}
.lowlist button{border:1px solid var(--low);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px}
.tools{display:grid;gap:10px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.subs button{font-size:13px;padding:4px 11px}
.chips.sub2 button{min-width:96px;font-weight:700}
.chips.subs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.group h3{margin:0;padding:10px 14px 6px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;min-height:60px}
.group .row:first-of-type{border-top:0}
.row .nm{min-width:0;font-weight:700;overflow-wrap:anywhere}
.row .sub{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.qty{font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.qty small{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.qty.lowtxt{color:var(--low)}
/* 在庫あり＝緑の数字と左の緑の線、在庫なし＝うすい灰色（2026/10/28） */
.row.has{box-shadow:inset 4px 0 0 var(--in)}
.row.has .qty{color:var(--in)}
.row.zero .qty{color:var(--muted);opacity:.55;font-weight:400}
.row.zero .nm{color:var(--muted)}
.qty .eq{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.qty .eq.lowtxt{color:var(--low)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--low);color:var(--surface);margin-left:6px;vertical-align:2px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-size:16px}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:15px;padding:10px 14px}
.btn.danger{background:var(--low);color:var(--surface)}
.btn:disabled{opacity:.45}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.in{background:var(--in-soft);color:var(--in)}
.tag.out{background:var(--out-soft);color:var(--out)}
.tag.back{background:var(--in-soft);color:var(--in);border:1px dashed var(--in)}
.tag.set,.tag.new,.tag.del{background:var(--accent-soft);color:var(--accent)}
.log .what{min-width:0;overflow-wrap:anywhere;font-weight:700;font-size:15px}
.log .n{font-weight:700;white-space:nowrap}
.log .meta{grid-column:2/4;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
form.f{padding:16px;display:grid;gap:14px}
label.fl{display:grid;gap:6px;font-size:14px;font-weight:700}
label.fl em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,18,26,.5);display:flex;align-items:flex-end;justify-content:center}
/* 下から出る画面の左上の「‹ 戻る」（2026/10/28 ユーザー）。下にスクロールしても上に残る */
.sheetback{position:sticky;top:-18px;z-index:2;justify-self:start;display:inline-flex;align-items:center;gap:2px;margin:-8px 0 -6px -6px;
  border:0;background:var(--bg);border-radius:10px;padding:6px 14px 6px 8px;min-height:40px;font-size:15px;font-weight:700;color:var(--accent);box-shadow:var(--shadow)}
.sheetback b{font-size:26px;line-height:1;font-weight:400;margin-top:-3px}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:19px;overflow-wrap:anywhere;text-wrap:balance}
.now{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:10px;background:var(--bg)}
.now b{font-size:30px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:700;font-size:15px}
.seg.two-seg{grid-template-columns:1fr 1fr}
.seg.three-seg{grid-template-columns:1fr 1fr 1fr}.seg.three-seg button{font-size:13px;line-height:1.3}
.now{flex-wrap:wrap}.now .nowpart{display:block;text-align:right;font-size:14px}.now .nowpart b{font-size:20px}
.seg button[data-p][aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.seg button[data-k="out"][aria-pressed="true"]{border-color:var(--out);background:var(--out-soft);color:var(--out)}
.seg button[data-k="back"][aria-pressed="true"]{border-color:var(--in);background:var(--in-soft);color:var(--in)}
.seg button[data-k="in"][aria-pressed="true"]{border-color:var(--in);background:var(--in-soft);color:var(--in)}
.seg button[data-k="set"][aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.stepper button{border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:28px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stepper button:active{background:var(--accent-soft)}
.stepper input{text-align:center;font-size:30px;font-weight:700;padding:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:15px}
.after{font-size:14px;color:var(--muted);margin:0}
.after b{color:var(--ink)}
.err{color:var(--low);font-weight:700;font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 8px;font-size:16px;font-weight:700}
.names button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.names button small.full{display:block;font-size:11px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.log .site{display:inline-block;font-size:12px;font-weight:700;color:var(--out);margin-right:6px}
.logtools{display:grid;gap:6px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .btn{width:auto;flex:1}
details.edit summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
details.edit form{padding:12px 0 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <a class="brandrow home" href="./" aria-label="メニューにもどる"><span class="back" aria-hidden="true">‹</span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">工場在庫<small>株式会社コウケン</small></div></a>
  <button class="who" id="whoBtn" type="button" aria-label="入力する人を変える"><b>入力</b><span id="whoName">名前をえらぶ</span></button>
</div></header>
<div class="wrap">
  <p class="banner" id="banner" hidden></p>

  <main id="vStock">
    <section class="panel alert lowonly" id="alert" aria-live="polite">
      <h2><span class="dot"></span><span id="alertTitle">読み込み中…</span></h2>
      <div class="lowlist" id="lowList"></div>
    </section>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="さがす（例：ALK 25 20、ALK テープ）" aria-label="材料をさがす">
      <div class="chips" id="cats" role="toolbar" aria-label="種類でしぼる"></div>
      <div class="chips subs" id="subs" role="toolbar" aria-label="色・材質でしぼる" hidden></div>
      <div class="chips subs sub2" id="subs2" role="toolbar" aria-label="ジャケットかエルボかでしぼる" hidden></div>
    </div>
    <div id="list" class="tools"></div>
  </main>

  <main id="vLog" hidden>
    <label class="fl logtools">現場でしぼる
      <select class="inp" id="logSite"></select>
    </label>
    <section class="panel">
      <ul class="log" id="log"></ul>
    </section>
    <p class="hint">新しい順に300件まで表示します。</p>
  </main>

  <main id="vAdd" hidden>
    <section class="panel">
      <form class="f" id="addForm" autocomplete="off">
        <label class="fl">材料の名前
          <input class="inp" id="aName" required maxlength="60" placeholder="例：スチロール保温筒 25A×20t">
        </label>
        <div class="two">
          <label class="fl">種類
            <select class="inp" id="aCat"></select>
          </label>
          <label class="fl">数え方
            <select class="inp" id="aUnit"></select>
          </label>
        </div>
        <label class="fl" id="aThkBox" hidden>厚み（mm） <em>例：0.27</em>
          <input class="inp" id="aThk" type="text" inputmode="decimal" maxlength="6" placeholder="例：0.27">
        </label>
        <label class="fl" id="aWidBox" hidden>幅（mm） <em>分からなければ空でOK</em>
          <input class="inp" id="aWid" type="number" inputmode="decimal" min="0" step="any" placeholder="例：920">
        </label>
        <label class="fl" id="aLenBox" hidden><span id="aLenLbl">1巻の長さ（m）</span> <em>分からなければ空でOK</em>
          <input class="inp" id="aLen" type="number" inputmode="decimal" min="0" step="any" placeholder="例：11">
        </label>
        <label class="fl" id="aSubBox" hidden><span id="aSubLbl">色・材質</span>
          <select class="inp" id="aSub"></select>
        </label>
        <div class="two" id="aEBox" hidden>
          <label class="fl">溶接ショートエルボの今ある数（個）
            <input class="inp" id="aWsQty" type="number" inputmode="decimal" min="0" step="any" value="0">
          </label>
          <label class="fl">溶接ロングエルボの今ある数（個）
            <input class="inp" id="aWlQty" type="number" inputmode="decimal" min="0" step="any" value="0">
          </label>
        </div>
        <div class="two">
          <label class="fl">今ある数
            <input class="inp" id="aQty" type="number" inputmode="decimal" min="0" step="any" value="0">
          </label>
          <label class="fl lowonly">少ないと知らせる数 <em>この数以下で赤くなる</em>
            <input class="inp" id="aMin" type="number" inputmode="decimal" min="0" step="any" value="0">
          </label>
        </div>
        <p class="err" id="aErr" hidden></p>
        <button class="btn" type="submit" id="aBtn">材料を登録する</button>
        <p class="hint">同じ材料でもサイズや厚みがちがうものは、別々に登録してください。</p>
      </form>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="画面の切りかえ">
  <button type="button" data-v="vStock" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5v11H3z"/><path d="M8 20v-6h8v6"/></svg>在庫</button>
  <button type="button" data-v="vLog"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>履歴</button>
  <button type="button" data-v="vAdd"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>材料を追加</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,updateDoc,deleteDoc,getDoc,getDocs,setDoc,onSnapshot,query,orderBy,limit,runTransaction,writeBatch,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";
import {SEED_SITES,SEED_ITEMS} from "./seed.js";
(function(){
/* 社員：[正式名, 呼び名]。正式名は原田さんの勤怠台帳と同じ（後で統合するとき名前でつなぐ）。記録には正式名を残す */
const STAFF=[["西崎剣","西崎"],["原田弓子","原田"],["福島正純","福島"],["田中嗣音","嗣穏"],["NGUYEN VAN HIEU","ヒエウ"],["DANG BINH DUONG","ズオン"],["NGUYEN NGOC LONG","ロン"]];
const NICK=Object.fromEntries(STAFF);
const nick=n=>NICK[n]||n||"";
const FACTORY="工場（加工）", OTHER="その他（メモに書く）";
/* 種類の中をさらに分ける（色・材質）。ジャケット・エルボとフランジカバー */
const COLORS=["ガルバリウム","ステン","アイボリー","ニュークリーム","シルバー","グレー","ホワイト","ブルー","キャメル"];
const SUBS={"ジャケット・エルボ":COLORS,"フランジカバー":COLORS,"PF保温筒":["直管","鉄管エルボ","塩ビエルボ","Susエルボ","溶接Sエルボ","溶接Lエルボ"]};
const SUBLABEL=c=>c==="PF保温筒"?"直管・エルボ":"色・材質";
const NOSUB="分けていない";

/* さがす：スペース（全角も）で区切った言葉が全部入っている材料を出す。
   数字はかたまりで比べ（25 は 25A に当たり 125A には当たらない）、数字は書いた順に並んでいるものだけ（「25 20」→ 25A×20t）（2026/10/28） */
const nz=t=>String(t||"").normalize("NFKC").toLowerCase();
/* 探すときの別名（2026/10/28）：アルミ粘着テープ＝ALK、SUS⇔ステン */
function aliases(it){
  const n=it.name||"",c=it.sub||"";let a="";
  if(/アルミ粘着テープ/.test(n))a+=" alk アルミテープ";
  if(/ステン/.test(n+c))a+=" sus";
  if(/SUS|Sus/.test(n+c))a+=" ステン";
  return a;
}
function matchQ(it,q){
  const text=nz(it.name+" "+(SUB2[it.cat]?sub2Of(it):it.cat)+" "+(it.sub||"")+" "+(it.no?"no."+it.no:"")+" "+sizeText(it)+" "+aliases(it));
  // 「/」「×」「x」「*」「-」も区切り。数字に付いた A・t・K・m は外す（「40A/20t」→「40 20」）（2026/10/28）
  // 漢字・かなと、アルファベット・数字の境目でも区切る（「黒ALGC」→「黒 algc」）
  const words=nz(q).replace(/([a-z0-9.])(?=[^\x00-\x7f])|([^\x00-\x7f])(?=[a-z0-9])/g,"$1$2 ").replace(/([a-z])(?=[0-9])/g,"$1 ").replace(/[\/×xX*＊\-－]/g," ").split(/\s+/).filter(Boolean).map(w=>/^[0-9.]+[atkm]$/.test(w)?w.slice(0,-1):w);
  let pos=0;
  for(const w of words){
    if(/^[0-9.]+$/.test(w)){
      const re=new RegExp("(?<![0-9])(?<![0-9]\\.)"+w.replace(/\./g,"\\.")+"(?![0-9])","g");re.lastIndex=pos;
      const m=re.exec(text);if(!m)return false;pos=m.index+m[0].length;
    }else if(!text.includes(w))return false;
  }
  return true;
}

  const after=h("p",{class:"after"});const err=h("p",{class:"err",hidden:true});
  const go=h("button",{class:"btn",type:"button"});
  const nowQty=()=>{const x=items.find(y=>y.id===id)||it;return Number(x[partField(part)])||0;};
  const partSeg=hasE?h("div",{class:"seg three-seg",role:"group","aria-label":"どれを数えるか"},
    [["s","直管（"+(it.unit||"本")+"）"],...EPARTS.map(([k,l])=>[k,l+"（個）"])].map(([k,l])=>h("button",{type:"button","data-p":k,"aria-pressed":String(k===part),onclick:()=>{part=k;store("kouken-part",k);if(kind==="set")num.value=fmtN(nowQty());upd();}},l))):null;
  const seg=h("div",{class:"seg",role:"group","aria-label":"何をするか"},
    // 入庫ボタンは外した（2026/10/28 ユーザー）。買った材料は「数を直す」で合わせる。前の入庫の履歴はそのまま出る
    [["out","持ち出し"],["back","戻し"],["set","数を直す"]].map(([k,l])=>h("button",{type:"button","data-k":k,"aria-pressed":String(k===kind),onclick:()=>{const was=kind;kind=k;if(k==="set")num.value=fmtN(nowQty());else if(was==="set"||num.value==="")num.value="1";upd();}},l)));
  function upd(){

    if(partSeg)partSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===part)));
    const n=Number(num.value);const cur=nowQty();
    const next=kind==="in"||kind==="back"?cur+n:kind==="out"?cur-n:n;
    after.replaceChildren((hasE?partName(part)+" ":"")+"このあと ",h("b",{text:isFinite(next)?fmtN(next)+unitOf():"―"}));
    go.textContent=kind==="in"?"入庫する":kind==="out"?"持ち出す":kind==="back"?"戻す":"この数に直す";
    err.hidden=true;
    siteBox.hidden=!SITEKIND(kind);siteLbl.textContent=kind==="back"?"どの現場から ":"どの現場へ ";
    go.disabled=readOnly||!(n>=0)||num.value===""||(kind!=="set"&&n===0)||(SITEKIND(kind)&&!siteSel.value);
  }
  num.addEventListener("input",upd);
  const step=d=>{const v=Math.max(0,(Number(num.value)||0)+d);num.value=fmtN(v);upd();};
  go.addEventListener("click",async()=>{
    const n=Number(num.value);

    if(SITEKIND(kind)&&siteSel.value===OTHER&&!memo.value.trim()){err.textContent="「その他」のときは、メモに"+(kind==="back"?"どこから戻したか":"行き先")+"を書いてください。";err.hidden=false;return;}
    go.disabled=true;go.textContent="記録しています…";

function errMsg(e){
  const c=e&&e.code;
  if(c==="permission-denied")return "暗証番号の確認がすんでいません。ページを開き直して、番号を入れてください。";
  if(c==="resource-exhausted")return "データがいっぱいです。社長に連絡してください。";
  if(c==="neg")return "在庫がマイナスになるので記録できません。数を確認してください。";
  if(e&&e.message==="nodoc")return "この材料は削除されています。";
  return "記録できませんでした。電波を確認して、もう一度押してください。";
}
async function moveStock(id,kind,n,memo,site,part){
  const ref=doc(fs,"items",id);let d,cur,next;const f=partField(part);
  // 同時に押されても数がずれないよう、トランザクションで書く
  await runTransaction(fs,async t=>{
    const snap=await t.get(ref);if(!snap.exists())throw new Error("nodoc");
    d=snap.data();cur=Number(d[f])||0;
    next=kind==="in"||kind==="back"?cur+n:kind==="out"?cur-n:n;
    next=Math.round(next*100)/100;
    if(next<0)throw Object.assign(new Error("neg"),{code:"neg"});
    t.update(ref,{[f]:next,updatedAt:Date.now(),updatedBy:who});
  });
  const delta=kind==="set"?Math.round((next-cur)*100)/100:n;
  await db.collection("logs").add({at:Date.now(),kind,itemId:id,itemName:d.name+(part&&part!=="s"?" "+partName(part):""),unit:part&&part!=="s"?"個":(d.unit||""),n:delta,after:next,who,memo:memo||"",site:site||"",part:part||"s"});
  return next;
}
async function removeItem(id){
  const it=items.find(x=>x.id===id);
  // あとから足す材料（EXTRA_ITEMS）は消すと作り直されるので、「削除した印」を付けて見えなくする
  if(EXTRA_ITEMS.some(x=>x.id===id))await db.doc("items/"+id).update({deleted:true,updatedAt:Date.now(),updatedBy:who});
  else await db.doc("items/"+id).delete();
  await db.collection("logs").add({at:Date.now(),kind:"del",itemId:id,itemName:it?it.name:"",unit:it?it.unit||"":"",n:0,after:0,who,memo:""});
}

    SPECS.flatMap(([t,o,list])=>list.map(a=>({id:"pf"+k+t.replace("t","")+"-"+a,name:"PF保温筒 "+e+" "+a+"×"+t,cat:"PF保温筒",sub:e,unit:"個",order:o}))))
];
async function ensureItems(){
  const have=new Set((await getDocs(collection(fs,"items"))).docs.map(d=>d.id));
  const miss=EXTRA_ITEMS.filter(x=>!have.has(x.id));
  for(let k=0;k<miss.length;k+=400){
    const batch=writeBatch(fs),now=Date.now();
    for(const x of miss.slice(k,k+400))batch.set(doc(fs,"items",x.id),{name:x.name,cat:x.cat,sub:x.sub||"",unit:x.unit,order:x.order||0,...(ROLL_LEN[x.name]?{len:ROLL_LEN[x.name]}:{}),...(SHEET_SIZE[x.name]?{wid:SHEET_SIZE[x.name][0],len:SHEET_SIZE[x.name][1]}:{}),...(x.thk?{thk:x.thk}:{}),...(x.no?{no:x.no}:{}),...(x.wid?{wid:x.wid}:{}),...(x.len?{len:x.len}:{}),qty:0,min:0,createdAt:now,updatedAt:now,updatedBy:who||"西崎剣"});
    await batch.commit();
  }
}
async function seedIfEmpty(){
  const [a,b]=await Promise.all([getDocs(query(collection(fs,"sites"),limit(1))),getDocs(query(collection(fs,"items"),limit(1)))]);
  if(!a.empty||!b.empty)return;
  const now=Date.now(),batch=writeBatch(fs);
  SEED_SITES.forEach((s,i)=>batch.set(doc(fs,"sites","s"+String(i+1).padStart(3,"0")),{name:s[0],status:s[1],order:i+1,active:true}));
  SEED_ITEMS.forEach((it,i)=>batch.set(doc(fs,"items","i"+String(i+1).padStart(3,"0")),{name:it[2],cat:it[0],unit:it[1],qty:0,min:0,createdAt:now,updatedAt:now,updatedBy:who||"西崎剣"}));
  await batch.commit();
}

/* 種類を分けたとき、前の種類で登録した材料を新しい種類に移す（2026/10/28）
   保温筒 → ALGC保温筒（名前にALGC）／ALK（P）保温筒（それ以外）、ロールのセラカバー → セラカバー、
   テープ・副資材のサンダム・遮音 → 遮音シート、テープ・副資材の亀甲・金網 → 金網 */
function newCat(x){
  const n=x.name||"";
  if(x.cat==="ALGC保温筒")return "ALGC（P）保温筒"; // 種類の名前を「ALGC（P）保温筒」に（2026/10/28）
  if(x.cat==="保温筒")return /ALGC/i.test(n)?"ALGC（P）保温筒":"ALK（P）保温筒";
  if(x.cat==="ロール"&&/セラカバー/.test(n))return "セラカバー";
  if(x.cat==="テープ・副資材"&&/サンダム|遮音/.test(n))return "遮音シート";
  if(x.cat==="テープ・副資材"&&/亀甲|金網/.test(n))return "金網";
  return null;
}
async function migrateCats(){
  const q=await getDocs(collection(fs,"items"));
  for(const d of q.docs){const x=d.data(),c=newCat(x);if(c)await updateDoc(d.ref,{cat:c});
    // PF保温筒の前の「エルボ」（eqty）は溶接ショートエルボ（wsqty）へ（2026/10/28）
    // 最初に入れた「アルミテープ」「ガルバコイル」「SUSコイル」は、請求書から足した材料と重なるので消す（2026/10/28 ユーザー）
    if((x.name==="アルミテープ"&&x.cat==="テープ・副資材")||(["ガルバコイル","SUSコイル"].includes(x.name)&&x.cat==="コイル")){await deleteDoc(d.ref);await addDoc(collection(fs,"logs"),{at:Date.now(),kind:"del",itemId:d.id,itemName:x.name,unit:x.unit||"",n:0,after:0,who:who||"西崎剣",memo:"重なっていたので削除",site:""});continue;}
    if(ROLL_LEN[x.name]&&!x.len)await updateDoc(d.ref,{len:ROLL_LEN[x.name]});
    if(SHEET_SIZE[x.name]&&!x.len)await updateDoc(d.ref,{wid:SHEET_SIZE[x.name][0],len:SHEET_SIZE[x.name][1]});
    // 30t以上は「ALKP保温筒」「ALGCP保温筒」と書く（2026/10/28）
    if(/^ALK保温筒 .*×(30|40|50)t$/.test(x.name||""))await updateDoc(d.ref,{name:x.name.replace(/^ALK保温筒/,"ALKP保温筒")});
    if(/^ALGC保温筒 .*×(30|40|50)t$/.test(x.name||""))await updateDoc(d.ref,{name:x.name.replace(/^ALGC保温筒/,"ALGCP保温筒")});
    if(x.cat==="PF保温筒"&&["鉄管","塩ビ","Sus"].includes(x.sub))await updateDoc(d.ref,{sub:"直管"});
    if(x.eqty!==undefined&&x.wsqty===undefined)await updateDoc(d.ref,{wsqty:Number(x.eqty)||0,eqty:deleteField(),emin:deleteField()});}
}

/* ---------- 起動 ---------- */
let fs=null, uid="";
renderWho();renderCats();renderList();renderLog();show(view);
(async()=>{
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){setBanner("まだ設定がすんでいません（firebase-config.js に Firebase の設定を入れてください）。");renderList();return;}
  try{
    const app=initializeApp(FIREBASE_CONFIG);// 一度読んだデータは携帯に覚えさせて、読み込み回数（無料は1日5万回）を減らす
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=getFirestore(app);}const auth=getAuth(app);
    await signInAnonymously(auth);uid=auth.currentUser.uid;
    const m=await getDoc(doc(fs,"members",uid));
    if(!m.exists())await askPin();
  }catch(e){setBanner("在庫データにつながりません。電波を確認して、ページを開き直してください。");renderList();return;}
  // 前の版と同じ呼び方で使えるよう、Firestore を包む
  db={doc:p=>{const r=doc(fs,p);return{update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)};},
      collection:n=>({add:d=>addDoc(collection(fs,n),d)})};
  try{await seedIfEmpty();}catch(e){}
  // 材料を作る・名前や種類を移す処理は、版（MIGRATE_VER）が上がったときに1回だけ。毎回やると全部の材料を読むので
  try{
    const m=await getDoc(doc(fs,"items","_meta"));const done=m.exists()?Number(m.data().ver)||0:0;
    if(done<MIGRATE_VER){await migrateCats();await ensureItems();await setDoc(doc(fs,"items","_meta"),{ver:MIGRATE_VER,at:Date.now()});}
  }catch(e){}
  onSnapshot(collection(fs,"items"),s=>{
    items=s.docs.filter(d=>!d.id.startsWith("_")).map(d=>Object.assign({id:d.id},d.data())).filter(x=>!x.deleted).sort((a,b)=>rank(a)-rank(b)||(a.name||"").localeCompare(b.name||"","ja",{numeric:true}));
    loaded=true;renderList();
  },e=>{setBanner("在庫を読み込めませんでした。ページを開き直してください。");});
  onSnapshot(query(collection(fs,"logs"),orderBy("at","desc"),limit(300)),s=>{logs=s.docs.map(d=>d.data());renderLog();},()=>{});
  // 現場の一覧（現場一覧の施工中・これからの現場）
  onSnapshot(collection(fs,"sites"),s=>{sites=s.docs.map(d=>d.data()).filter(x=>x&&x.name&&x.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));renderLog();},()=>{});
  if(!who)setTimeout(()=>{if(!who&&$("scrim").hidden)pickWho();},400);
})();
})();
</script>
