<!doctype html>
<html lang="ja" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>予定表｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 社員の予定表（LINE WORKSのカレンダーの代わり）。上に月のカレンダー、下にえらんだ日の予定。入れる・直すのは西崎さんと原田さんだけ。色と文字は在庫と同じ */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --low:#b0322d; --low-soft:#fbdfdd; --sat:#0b5cab; --today:#fbeecd;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --sat:#6fb0f0; --today:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --sat:#6fb0f0; --today:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
/* 続けてタップしても拡大しない（日にちの2回タップで予定を入れるため） */
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  margin:0;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
/* 戻る「‹」：指で押しやすいよう、幅と高さのある四角にする（2026/10/28 ユーザー） */
.brandrow .back{display:grid;justify-items:center;align-content:center;flex:none;min-width:44px;height:46px;margin:-4px -2px -4px -8px;border-radius:10px;
  background:rgba(255,255,255,.16);line-height:1;padding:0 5px 3px}
/* 戻るボタン：「‹」の下に、どこへ戻るか（TOP）を書く（2026/10/28 ユーザー） */
.brandrow .back b{font-size:26px;font-weight:400;line-height:.9}
.brandrow .back .backlbl{font-size:10.5px;font-weight:700;letter-spacing:.06em}
a.brandrow:active .back{background:rgba(255,255,255,.3)}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.06em;white-space:nowrap}
.brand{min-width:0;overflow:hidden}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.who b{opacity:.78;font-weight:400;font-size:11px}
button.who{color:inherit;font:inherit;font-size:13px}
/* お知らせ（自分の予定が変わったとき） */
.notice{padding:12px 14px;display:grid;gap:8px;border-color:var(--low);background:var(--low-soft)}
.pushbox{padding:12px 14px;display:grid;gap:8px}
.pushbox h3{margin:0;font-size:15px}
.pushbox .rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.pushbox .btn{width:auto;padding:10px 16px;font-size:15px}
.notice h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--low)}
.notice .dot{width:10px;height:10px;border-radius:50%;background:var(--low);flex:none}
.notice ul{list-style:none;margin:0;padding:0;display:grid}
.notice li button{border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:left;font-size:14px;width:100%;overflow-wrap:anywhere}
.notice li:first-child button{border-top:0}
.notice .btn{justify-self:start;width:auto}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--today);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
/* 月の切りかえ */
.month{display:grid;grid-template-columns:44px 1fr 44px auto;align-items:center;gap:6px;padding:8px 8px 4px}
.month h2{margin:0;text-align:center;font-size:19px}
.month button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;font-size:20px}
.month .tday{font-size:13px;padding:0 10px;font-weight:700}
/* 人でしぼる */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button.pbtn{font-weight:700}
.chips button.pbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chips button.pbtn.dim{opacity:.4}
/* 月：LINE WORKS の作り */
.cal.lw{display:block;padding:0 0 6px}
.lwhd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12.5px;color:var(--ink);padding:6px 0 2px}
.lwhd .sun{color:var(--low)}
.lwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:0;row-gap:2px;border-top:1px solid var(--line);position:relative}
.lwday{border:0;background:transparent;padding:0;margin:0;z-index:0;cursor:pointer}
.lwday.sel{background:var(--accent-soft)}
.lwn{z-index:1;pointer-events:none;justify-self:center;align-self:center;font-size:15px;line-height:1;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.lwn.red{color:var(--low)} .lwn.out{opacity:.45}
.lwn.today{background:#1f1f1f;color:#fff;font-weight:700;opacity:1}
.lwbar{z-index:1;pointer-events:none;align-self:stretch;margin:0 1px;border-radius:3px;font-size:11.5px;line-height:22px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.02em}
.lwbar.l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.lwbar.r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.lwbar.off{opacity:.6}
.lwmore{z-index:1;pointer-events:none;font-size:11px;color:var(--muted);padding-left:6px;line-height:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lwn.today{background:#f1f1f1;color:#111}}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px 6px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .wd.sun{color:var(--low)} .cal .wd.sat{color:var(--sat)}
.day{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:76px;border:0;border-top:1px solid var(--line);background:none;padding:3px 2px 4px;text-align:left}
.day .n{font-size:12px;font-weight:700;line-height:1;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex:none}
.day.sun .n,.day.hol .n{color:var(--low)} .day.sat .n{color:var(--sat)}
.day.out{opacity:.38}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"]{background:var(--accent-soft);border-radius:6px}
/* 予定の札：うすい人の色の地に黒い文字、左の線と名前が人の色（2026/10/28 ユーザーがA案をえらんだ）。--pc に人の色を入れる */
.chip{display:block;font-size:11px;line-height:1.4;padding:1px 3px 1px 4px;border-radius:0;border-left:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--surface));
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:500;letter-spacing:-.02em}
.chip b{font-weight:700;color:var(--pc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:color-mix(in srgb,var(--pc) 30%,var(--surface))}
  :root:not([data-theme="light"]) .chip b{color:color-mix(in srgb,var(--pc) 55%,#fff)}}
.cal .day.open .chip,.cal.week .chip{padding:2px 2px 2px 3px}
.cal .day.open .chip b,.cal.week .chip b{display:block;font-size:12px;line-height:1.25;white-space:nowrap;letter-spacing:-.04em}
/* 外注さんの会社名など4文字以上は、マスに入るよう小さめに */
.cal .day.open .chip b.long,.cal.week .chip b.long{font-size:10px;letter-spacing:-.06em;line-height:1.5}
.cal .day.open .chip .w,.cal.week .chip .w{display:block;font-size:11px;line-height:1.3}
.more{font-size:10px;color:var(--muted);padding-left:2px;line-height:1.2}
.chip.off{opacity:.55}
/* 表示の切りかえ（月・週・一覧・メンバー） */
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px 8px}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-size:14px}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
/* 週：マスを高くして、予定を折り返して全部出す */
.cal.week .day{min-height:220px}
.cal.week .chip{white-space:normal;overflow-wrap:break-word;line-height:1.3}
/* 月：えらんだ日の週は広げて、全員の予定を折り返して全部出す */
.cal .day.open .chip{white-space:normal;overflow-wrap:break-word;line-height:1.3}
/* メンバー予定表：縦に人、横に1週間 */
.mem{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));padding:0 4px 6px;touch-action:pan-y;will-change:transform}
.cal{touch-action:pan-y;will-change:transform}
/* 指で横に動かしている間、はみ出した所を見せない */
.memclip{overflow:hidden}
.mem .hd{font-size:11px;font-weight:700;text-align:center;padding:4px 0;color:var(--muted);line-height:1.2}
.mem .hd b{display:block;font-size:13px;color:var(--ink)}
.mem .hd.sun b,.mem .hd.hol b{color:var(--low)} .mem .hd.sat b{color:var(--sat)}
.mem .hd.today b{color:#fff;background:#1f1f1f;border-radius:50%;width:22px;height:22px;line-height:22px;margin:0 auto}
.mem .nm{font-size:12px;font-weight:700;border-top:1px solid var(--line);padding:6px 2px;display:flex;align-items:center;overflow-wrap:anywhere;line-height:1.2}
.mem .cell{border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;padding:3px 2px;min-height:54px;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.mem .cell[aria-pressed="true"]{background:var(--accent-soft)}
.mem .cell .chip{white-space:normal;overflow-wrap:break-word;line-height:1.25;padding:1px 2px 1px 3px;border-left-width:2px}
/* 一覧 */
.lday{border-top:1px solid var(--line)}
.lday:first-child{border-top:0}
.lday h4{margin:0;padding:10px 14px 0;font-size:14px}
.lday h4.sun,.lday h4.hol{color:var(--low)} .lday h4.sat{color:var(--sat)}
.lday .ev{border-top:0;padding-top:6px}
.lday .ev+.ev,.lday li+li .ev{border-top:1px dashed var(--line)}
/* えらんだ日の予定 */
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 6px}
.dhead h3{margin:0;font-size:17px}
.dhead .hn{font-size:12px;color:var(--low);font-weight:700;margin-left:6px}
.evs{list-style:none;margin:0;padding:0 0 4px}
.ev{display:grid;grid-template-columns:6px 1fr;gap:0 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px}
.ev .bar{grid-row:1/5;border-radius:3px}
.ev .st{font-weight:700;overflow-wrap:anywhere}
.ev .pp{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
/* 名前の札：カレンダーの札と同じ見た目（うすい人の色の地、左の線と名前が人の色）2026/10/28 ユーザー */
.pname{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:3px}
.lwchip{display:block;font-size:11px;line-height:1.3;padding:2px 3px;border-radius:3px;white-space:normal;overflow-wrap:break-word;letter-spacing:-.02em}
.lwchip.past{opacity:.7} .lwchip.off{opacity:.6}
.ev .pp span{font-size:13px}
.ev .pp span.me{outline:2px solid var(--ink);outline-offset:1px}
.ev .mm{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.ev .span{font-size:12px;color:var(--muted)}
.empty{padding:20px 14px 24px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}
.foot button{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:12px;padding:6px}
/* 下の「予定を入れる」 */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.addbar .btn{max-width:608px;margin:0 auto;display:block}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:15px;padding:10px 14px}
.btn.danger{background:var(--low);color:var(--surface)}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1}
/* 下から出るパネル */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,18,26,.5);display:flex;align-items:flex-end;justify-content:center}
/* 下から出る画面の左上の「‹ 戻る」（2026/10/28 ユーザー）。下にスクロールしても上に残る */
.sheetback{position:sticky;top:-18px;z-index:2;justify-self:start;display:inline-flex;align-items:center;gap:2px;margin:-8px 0 -6px -6px;
  border:0;background:var(--bg);border-radius:10px;padding:6px 14px 6px 8px;min-height:40px;font-size:15px;font-weight:700;color:var(--accent);box-shadow:var(--shadow)}
.sheetback b{font-size:26px;line-height:1;font-weight:400;margin-top:-3px}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:19px}
form.f{display:grid;gap:14px}
label.fl,.fl{display:grid;gap:6px;font-size:14px;font-weight:700}
.fl em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
textarea.inp{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--low);font-weight:700;font-size:14px;margin:0}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 4px;font-size:15px;font-weight:700}
.names button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.names button.out{font-size:13px;border-style:dashed}
/* 現場をえらぶ：ボタンを並べ、多いときは中でスクロール */
.pickcap{font-size:12px;font-weight:400;color:var(--muted)}
.sitepick{display:flex;flex-wrap:wrap;gap:6px;max-height:168px;overflow-y:auto;padding:2px}
.sitepick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:500}
.sitepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
/* 覚えた現場名：右に「×」。1回押すと「消す」に変わり、もう1回で消す */
.remchip{display:inline-flex;align-items:stretch}
.remchip button[data-n]{border-radius:999px 0 0 999px;border-right:0}
.remchip .forget{border:1px solid var(--line);border-left:1px dashed var(--line);background:var(--bg);border-radius:0 999px 999px 0;padding:0 10px;font-size:14px;color:var(--muted)}
.remchip .forget[data-ok="1"]{background:var(--low);border-color:var(--low);color:#fff;font-weight:700}
.btn.change{background:var(--today);color:var(--ink);border:1px solid var(--line);font-size:15px;padding:11px 14px}
/* 2回タップしたときの「入れる／直す」えらび */
.menulist{display:grid;gap:8px}
.menuev{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.menuev .bar{align-self:stretch;border-radius:3px}
.menuev b{display:block;font-size:15px;overflow-wrap:anywhere}
.menuev small{display:block;font-size:12.5px;color:var(--muted)}
.menuev .pp{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.menuev .go{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.kakobox{display:grid;gap:6px;padding:10px;border-radius:8px;border:1px dashed var(--accent);background:var(--accent-soft);margin-top:4px}
.rembox{display:grid;gap:6px;padding:10px;border-radius:8px;background:var(--today);font-size:13px;font-weight:400}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;font-weight:700;font-size:14px}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <a class="brandrow home" href="./" aria-label="メニューにもどる"><span class="back" aria-hidden="true"><b>‹</b><span class="backlbl">TOP</span></span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">予定表<small>株式会社コウケン</small></div></a>

<script type="module">
// 通知を押したとき、開いている画面を注文の画面に切り替える（2026/10/30）

async function chkOpen(){try{const c=await caches.open("kouken-open");const r=await c.match("pending");if(!r)return;const t=await r.json();await c.delete("pending");if(Date.now()-t.at<300000)location.href=t.url;}catch(e){}}

import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,updateDoc,deleteDoc,getDoc,setDoc,onSnapshot,query,where,orderBy,limit,deleteField,FieldPath,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

(function(){

/* 外注さん（会社名で予定に入れる）。上の「人でしぼる」と「あなたはだれ」には出さない（2026/10/28 ユーザー） */
const OUTS=[["竹内工業","竹内工業"],["高橋断熱","高橋断熱"]];

/* 予定表に出す人。原田さんは予定に入れない（2026/10/28 ユーザー）。予定を入れる人としては残る */

/* 予定に入れられる人：社員と外注さん */
const ASSIGN=[...PEOPLE,...OUTS];
const nick=n=>NICK[n]||n||"";
/* 予定を入れられる人 */
const EDITORS=["西崎剣","原田弓子"];
/* だれもえらばない予定は西崎さんのメモ。memos に分けて置き、西崎さんだけが読める（2026/10/28 ユーザー） */

const FACTORY="工場（加工）", OFF="休み";
/* 手で入れた現場名のうち「覚える」をえらんだもの。sites/_yotei の used に { 現場名: 最後に行く日 } で置く
   （名前の欄がないので在庫の現場一覧には出ない）。最後に行く日から2か月使われなかった現場名は消す（2026/10/28 ユーザー） */
let remembered=[], usedMap={};

}

  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日","2027-04-29":"昭和の日",
  "2027-05-03":"憲法記念日","2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日","2027-09-20":"敬老の日",

/* 現場の色。白い文字が読める濃さ。現場名から決まるので、いつも同じ色になる */

const ORDER=Object.fromEntries([...STAFF,...OUTS].map((s,i)=>[s[0],i]));
const VIEWS=[["month","月"],["week","週"],["list","一覧"],["member","メンバー"]];

const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}

  return e;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
let toastT;function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function setBanner(msg){$("banner").textContent=msg||"";$("banner").hidden=!msg;}

/* 日付は "2026-11-09" の文字で持つ（並べ替え・比べるのがかんたん） */
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const WD="日月火水木金土";
const md=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）";};
const todayS=()=>ymd(new Date());

let fs=null, uid="", editor="", events=[], sites=[], unsub=null;
let sel=todayS();
let ym=sel.slice(0,7);                    // 表示している月 "2026-11"
let person=store("kouken-yotei-person")||"すべて";
if(person!=="すべて"&&!PEOPLE.some(([n])=>n===person))person="すべて";
let me=store("kouken-who")||"";          // この携帯を使う人（在庫で選んだ名前と同じ）
if(me&&!NICK[me])me="";
let view="month";  // 入り直したら、いつも「月」から（前に見ていた表示は覚えない 2026/10/31 ユーザー）
if(!VIEWS.some(v=>v[0]===view))view="month";
const weekly=()=>view==="week"||view==="member";

/* ---------- 人でしぼる ---------- */
function renderPeople(){
  $("people").replaceChildren(...[["すべて","すべて"],...PEOPLE].map(([n,k])=>h("button",{type:"button","aria-pressed":String(n===person),
    // 名前のボタンは、カレンダーの帯と同じ色でぬる。えらんだ人は太い枠、ほかの人はうすく（2026/10/31 ユーザー「色の統一」）
    class:n==="すべて"?null:"pbtn"+(person!=="すべて"&&n!==person?" dim":""),
    style:n!=="すべて"?{background:lwBg(n),borderColor:lwBg(n),color:lwFg(n)}:null,
    onclick:()=>{person=n;store("kouken-yotei-person",n);renderPeople();renderAll();}},k)));
}
const shown=()=>person==="すべて"?events:events.filter(e=>(e.people||[]).includes(person));
const onDay=(list,s)=>list.filter(e=>e.date<=s&&(e.end||e.date)>=s);
/* 予定の並び：社員の順、そのあと人のいない予定 */
const firstP=e=>Math.min(99,...(e.people||[]).map(n=>ORDER[n]??50));
const sortEv=list=>list.slice().sort((x,y)=>firstP(x)-firstP(y)||(x.site||"").localeCompare(y.site||"","ja"));

/* ---------- 表示の切りかえ ---------- */
function renderViews(){
  $("views").replaceChildren(...VIEWS.map(([v,k])=>h("button",{type:"button","aria-pressed":String(v===view),
    onclick:()=>{const old=range().join();view=v;store("kouken-yotei-view",v);if(range().join()!==old)listen();renderAll();}},k)));
}
function renderAll(){
  renderViews();
  const [y,m]=ym.split("-").map(Number);
  if(weekly()){const [a,b]=weekRange();$("mTitle").textContent=md(a).replace(/（.）/,"")+"〜"+md(b).replace(/（.）/,"");}
  else $("mTitle").textContent=y+"年"+m+"月";
  $("prev").setAttribute("aria-label",weekly()?"前の週":"前の月");$("next").setAttribute("aria-label",weekly()?"次の週":"次の月");

  $("dayPanel").hidden=view==="list";$("listPanel").hidden=view!=="list";

/* ---------- 月・週のカレンダー ---------- */
function gridRange(){
  const first=parse(ym+"-01");
  const start=new Date(first);start.setDate(1-first.getDay());
  const last=new Date(first.getFullYear(),first.getMonth()+1,0);
  const end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));
  return [ymd(start),ymd(end)];
}
function weekRange(){const d=parse(sel);d.setDate(d.getDate()-d.getDay());const a=ymd(d);return [a,addDays(a,6)];}
const range=()=>weekly()?weekRange():gridRange();
/* マスに出す1つ1つ：人がいれば「呼び名 現場」を人の色で1人ずつ、いなければ現場だけを灰色で */
function dayItems(s){
  const out=[];
  for(const e of sortEv(onDay(shown(),s))){
    const what=siteText(e), off=e.site===OFF;
    const ps=(e.people||[]).filter(n=>person==="すべて"||n===person).sort((a,b)=>(ORDER[a]??50)-(ORDER[b]??50));
    if(ps.length)for(const n of ps)out.push({n,name:nick(n),what,color:pcolor(n),off});
    else out.push({n:"",name:"",what,color:NOONE,off});
  }
  return out.sort((a,b)=>(a.n?ORDER[a.n]??50:99)-(b.n?ORDER[b.n]??50:99));
}
const chip=it=>h("span",{class:"chip"+(it.off?" off":""),style:"--pc:"+it.color},it.name?h("b",{class:it.name.length>=4?"long":null,text:it.name}):null,it.name?" ":null,h("span",{class:"w",text:it.what}));
function select(s){const old=range().join();sel=s;ym=s.slice(0,7);openWeek=weekRange()[0];if(range().join()!==old)listen();renderAll();}
/* 月：広げている週（その週の日曜日）。""なら閉じている。同じ日をもう一度押すと閉じる */
let openWeek=weekRange()[0], animNext=false;
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  if(!editor){one();return;}

  if(tapT){clearTimeout(tapT);tapOne&&tapOne();}           // 別の日を押したら、前の1回分をすぐやる

/* 2回タップ：その日に予定があれば「新しく入れる」か「どの予定を直す」かをえらぶ。なければすぐ入れる画面（2026/10/28 ユーザー） */
const addOn=(s,preset)=>{select(s);dayMenu(s,preset);};

/* ---------- 月：LINE WORKS と同じ作り（2026/10/31 ユーザー）
   何日も続く予定は、週の中で日をまたいだ1本の帯。帯の色は人ごと（LINE WORKS のスマホの色合い）。
   ふだんは1週に2段まで出して、あふれた分は日ごとに「＋数」。週を押すと広がって全部出る ---------- */
/* 人の色：6人＋西崎がはっきり分かれる色。紫はウレタン予定で使うので人には使わない（西崎はこい灰色）（2026/10/31 ユーザー「ズオンと福島、ヒエウと嗣穏が被る」）。白い字が読める濃さ */
const LWC={"西崎剣":["#3b4452","#fff"],"福島正純":["#f07f22","#fff"],"DANG BINH DUONG":["#d6337a","#fff"],"NGUYEN VAN HIEU":["#2b62d9","#fff"],
  "田中嗣音":["#0ea5a5","#fff"],"NGUYEN NGOC LONG":["#3f9b3a","#fff"],"原田弓子":["#9a6a3a","#fff"],"竹内工業":["#c49a12","#fff"],"高橋断熱":["#a8322a","#fff"]};
const LW_NONE=["#9aa3b2","#fff"];
const lwc=n=>LWC[n]||LW_NONE;
const LW_LANES=2;
function weekBars(wa,wb){
  const bars=[];
  for(const e of shown()){
    const a=e.date, b=e.end||e.date;if(b<wa||a>wb)continue;

    // 何人か・何日かの予定は、この日だけ・一部の人だけを別の現場に変えられる
    !isNew&&e.col!=="memos"&&((e.people||[]).length>1||(e.end&&e.end!==e.date))?
      h("button",{class:"btn change",type:"button",onclick:()=>{close();openChange(e);}},"この日だけ・一部の人だけ 変える"):null,
    h("div",{class:"two"},h("label",{class:"fl"},"日にち",dIn),h("label",{class:"fl"},h("span",null,"終わりの日 ",h("em",{text:"何日か続くとき"})),eIn)),
    h("div",{class:"fl"},h("span",null,"だれが ",h("em",{text:isBoss()?"だれもえらばないか西崎だけにすると、西崎さんだけが見られるメモになります":"何人でもえらべます"})),names),
    sp.el,
    h("label",{class:"fl"},h("span",null,"メモ ",h("em",{text:"なくてもよい"})),mIn),
    err,save,
    !isNew?h("div",{class:"rowbtns"},
      h("button",{class:"btn ghost",type:"button",onclick:()=>{close();openEdit(e,true);}},"別の日にコピー"),
      h("button",{class:"btn ghost",type:"button",onclick:async b=>{
        const t=b.currentTarget;
        if(t.dataset.ok!=="1"){t.dataset.ok="1";t.className="btn danger";t.textContent="本当に消す";return;}
        t.disabled=true;
        try{
          if(e.col==="memos")await deleteDoc(doc(fs,"memos",e.id));
          else await updateDoc(doc(fs,"events",e.id),{deleted:true,prevPeople:e.people||[],updatedAt:Date.now(),updatedBy:editor});
          close();toast(e.col==="memos"?"メモを消しました":"予定を消しました");}
        catch(y){fail("消せませんでした。電波を確認してください。");t.disabled=false;}
      }},"消す")):null);
  close=openSheet(form);
}
/* この日だけ・一部の人だけ変える（例：ヒエウだけ、今日は目黒マンションから三鷹へ）
   元の予定からえらんだ人を外し、その人のほかの日は元の現場のまま残し、この日だけ新しい現場の予定を作る */
function openChange(e){
  const a=e.date, b=e.end||e.date, P=e.people||[];
  const d0=sel>=a&&sel<=b?sel:a;
  const dIn=h("input",{class:"inp",type:"date",value:d0,min:a,max:b,required:true});
  const picked=new Set(P.length===1?P:(person!=="すべて"&&P.includes(person)?[person]:[]));
  const names=h("div",{class:"names",role:"group","aria-label":"だれを変える"},ASSIGN.filter(([n])=>P.includes(n)).map(([n,k])=>h("button",{type:"button","aria-pressed":String(picked.has(n)),
    onclick:ev2=>{picked.has(n)?picked.delete(n):picked.add(n);ev2.currentTarget.setAttribute("aria-pressed",String(picked.has(n)));}},k)));
  const sp=sitePicker("","");
  const mIn=h("textarea",{class:"inp",placeholder:"例：午後から三鷹へ"},"");
  const err=h("p",{class:"err",hidden:true});
  const save=h("button",{class:"btn",type:"submit"},"変える");
  let close;
  const form=h("form",{class:"f",onsubmit:async x=>{x.preventDefault();
    const fail=m=>{err.textContent=m;err.hidden=false;};
    const d=dIn.value, who=ASSIGN.map(s=>s[0]).filter(n=>picked.has(n)), site=sp.site();
    if(!d||d<a||d>b)return fail(md(a)+"から"+md(b)+"の間の日をえらんでください。");
    if(!who.length)return fail("だれを変えるかえらんでください。");
    if(!site)return fail("新しい現場をえらんでください。");
    if(sp.check())return fail(sp.check());
    save.disabled=true;err.hidden=true;
    try{
      const now=Date.now(), R=P.filter(n=>!who.includes(n)), batch=writeBatch(fs), col=collection(fs,"events");
      // ほかの日の分は、知らせを出さない（quiet）
      const keep={site:e.site||"",kako:e.kako||"",memo:e.memo||"",people:who,prevPeople:who,quiet:true,createdAt:now,createdBy:editor,updatedAt:now,updatedBy:editor};
      if(R.length)batch.update(doc(fs,"events",e.id),{people:R,prevPeople:P,quiet:true,updatedAt:now,updatedBy:editor});
      else batch.update(doc(fs,"events",e.id),{deleted:true,prevPeople:P,quiet:true,updatedAt:now,updatedBy:editor});
      if(a<d)batch.set(doc(col),{...keep,date:a,end:addDays(d,-1)===a?"":addDays(d,-1)});
      if(d<b)batch.set(doc(col),{...keep,date:addDays(d,1),end:addDays(d,1)===b?"":b});
      batch.set(doc(col),{date:d,end:"",people:who,prevPeople:[],site,kako:sp.kako(),memo:mIn.value.trim(),createdAt:now,createdBy:editor,updatedAt:now,updatedBy:editor});
      await batch.commit();
      const remd=await sp.remember(d);
      close();select(d);
      toast(who.map(nick).join("・")+"の"+md(d)+"を変えました"+(remd?"（現場名を覚えました）":""));
    }catch(y){fail(y&&y.code==="permission-denied"?"変える権限がありません。":"保存できませんでした。電波を確認してください。");save.disabled=false;}
  }},
    h("h2",{text:"この日だけ変える"}),
    h("p",{class:"hint",text:"いまの予定："+(a===b?md(a):md(a)+"〜"+md(b))+"　"+siteText(e)+"（"+P.map(nick).join("・")+"）"}),
    h("label",{class:"fl"},h("span",null,"変える日 ",h("em",{text:"この日だけ新しい現場になります"})),dIn),
    h("div",{class:"fl"},h("span",null,"だれを ",h("em",{text:"えらんだ人だけ変わります"})),names),
    sp.el,
    h("label",{class:"fl"},h("span",null,"メモ ",h("em",{text:"なくてもよい"})),mIn),
    err,save);
  close=openSheet(form);
}

/* ---------- 編集する人の登録（西崎・原田が最初に1回だけ。編集用の暗証番号をデータベース側で確かめる） ---------- */
function askEditPin(){
  let name=EDITORS[0];
  // 名前は社員全員を並べる。ただし登録できるのは西崎・原田だけ（ほかの人は番号が合っていても「番号がちがいます」）2026/10/29 ユーザー
  const names=h("div",{class:"names",style:{gridTemplateColumns:"1fr 1fr"}},STAFF.map(([n])=>n).map(n=>h("button",{type:"button","aria-pressed":String(n===name),
    onclick:x=>{name=n;names.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===nick(n))));}},nick(n))));
  const inp=h("input",{class:"inp",type:"password",inputmode:"numeric",autocomplete:"off",maxlength:"12","aria-label":"編集用の暗証番号",style:{fontSize:"28px",textAlign:"center",letterSpacing:".3em"}});
  const err=h("p",{class:"err",hidden:true});
  const go=h("button",{class:"btn",type:"submit"},"編集できるようにする");
  let close;
  const form=h("form",{class:"f",onsubmit:async e=>{e.preventDefault();
    const v=inp.value.trim();if(!v)return;
    go.disabled=true;err.hidden=true;
    if(!EDITORS.includes(name)){err.textContent="番号がちがいます。";err.hidden=false;go.disabled=false;inp.select();return;}
    try{await setDoc(doc(fs,"editors",uid),{pin:v,name,at:Date.now()});editor=name;close();applyEditor();toast(nick(name)+"さん、予定を入れられます");}
    catch(x){err.textContent=x&&x.code==="permission-denied"?"番号がちがいます。":"確認できませんでした。電波を確認してください。";err.hidden=false;go.disabled=false;inp.select();}
  }},h("h2",{text:"予定を入れる人の登録"}),h("p",{class:"hint",text:"この携帯で最初に1回だけ入れてください。"}),names,inp,err,go);
  close=openSheet(form);
}
$("editLogin").addEventListener("click",askEditPin);
function applyEditor(){
  $("who").replaceChildren(editor?h("b",{text:"入力"}):me?h("b",{text:"見る"}):"",editor?nick(editor):me?nick(me):"名前をえらぶ");
  $("editLogin").hidden=!!editor||!fs;$("addHint").hidden=!editor;
  listen();renderAll();listenNotices();
}
/* ---------- あなたはだれ（お知らせを出す相手。予定を入れる人は登録した名前） ---------- */
function pickMe(){
  const close=openSheet(h("h2",{text:"あなたはだれですか？"}),h("p",{class:"hint",text:"あなたの予定が入ったり変わったりしたとき、ここでお知らせします。この携帯に覚えておきます。"}),
    h("div",{class:"names"},PEOPLE.map(([n,k])=>h("button",{type:"button","aria-pressed":String(n===me),onclick:()=>{me=n;store("kouken-who",n);close();applyEditor();}},k))));
}
$("who").addEventListener("click",()=>{if(!editor)pickMe();});

/* ---------- お知らせ（前に「確認した」を押したあとに、自分の予定が入った・変わった・消えた・外れたとき） ---------- */
let unNotice=null;
const myName=()=>editor||me;
const seenKey=()=>"kouken-yotei-seen-"+myName();
function listenNotices(){
  if(unNotice){unNotice();unNotice=null;}
  const n=myName();
  if(!fs||!n){renderNotices([]);return;}
  let seen=Number(store(seenKey()))||0;
  if(!seen){seen=Date.now();store(seenKey(),String(seen));}   // はじめての携帯は、今から先の変更だけ知らせる
  unNotice=onSnapshot(query(collection(fs,"events"),where("updatedAt",">",seen),orderBy("updatedAt","desc"),limit(50)),s=>{
    renderNotices(s.docs.map(d=>Object.assign({id:d.id},d.data()))
      .filter(e=>!e.quiet&&e.updatedBy!==n&&((e.people||[]).includes(n)||(e.prevPeople||[]).includes(n))));
  },()=>{});
}
function noticeKind(e,n){
  if(e.deleted)return "消えました";
  if(!(e.people||[]).includes(n))return "外れました";
  if(!(e.prevPeople||[]).includes(n))return "入りました";
  return "変わりました";
}
function renderNotices(list){
  const box=$("notice"), n=myName();
  if(!list.length){box.hidden=true;box.replaceChildren();return;}
  box.hidden=false;
  box.replaceChildren(h("h3",null,h("span",{class:"dot"}),nick(n)+"さんの予定が"+list.length+"件変わりました"),
    h("ul",null,list.map(e=>h("li",null,h("button",{type:"button",onclick:()=>select(e.date)},
      h("b",{text:md(e.date)+(e.end&&e.end!==e.date?"〜"+md(e.end):"")}),"　"+siteText(e)+" が"+noticeKind(e,n))))),
    h("button",{class:"btn ghost",type:"button",onclick:()=>{store(seenKey(),String(Date.now()));listenNotices();}},"確認した"));
}

/* ---------- 会社の暗証番号（在庫と同じ。もう入れた携帯は聞かない） ---------- */
function askPin(){
  return new Promise(resolve=>{
    const inp=h("input",{class:"inp",type:"password",inputmode:"numeric",autocomplete:"off",maxlength:"12","aria-label":"暗証番号",style:{fontSize:"28px",textAlign:"center",letterSpacing:".3em"}});
    const err=h("p",{class:"err",hidden:true});
    const go=h("button",{class:"btn",type:"submit"},"はじめる");
    const form=h("form",{class:"f",onsubmit:async e=>{e.preventDefault();
      const v=inp.value.trim();if(!v)return;
      go.disabled=true;go.textContent="確認しています…";err.hidden=true;
      try{await setDoc(doc(fs,"members",uid),{pin:v,at:Date.now()});$("scrim").hidden=true;$("scrim").replaceChildren();resolve();}
      catch(x){err.textContent=x&&x.code==="permission-denied"?"番号がちがいます。":"確認できませんでした。電波を確認してください。";err.hidden=false;go.disabled=false;go.textContent="はじめる";inp.select();}
    }},h("h2",{text:"会社の暗証番号"}),h("p",{class:"hint",text:"最初の1回だけ入れてください。この携帯に覚えておきます。"}),inp,err,go);
    openSheet(form);
    $("scrim").onclick=null;               // 番号を入れるまで閉じられない
    $("scrim").querySelector(".sheetback")?.remove();
  });
}

/* ---------- 予定を読む（表示している月のぶんだけ。何日も続く予定のため、2か月前から始まるものも読む） ---------- */
let evList=[], memoList=[], unsubMemo=null;
function listen(){
  if(!fs)return;
  if(unsub)unsub();
  if(unsubMemo){unsubMemo();unsubMemo=null;}
  const [a,b]=range();
  const q=c=>query(collection(fs,c),where("date",">=",addDays(a,-62)),where("date","<=",b),orderBy("date"));
  const merge=()=>{events=[...evList,...memoList].filter(e=>!e.deleted&&(e.end||e.date)>=a);renderAll();};
  unsub=onSnapshot(q("events"),s=>{
    evList=s.docs.map(d=>Object.assign({id:d.id,col:"events"},d.data()));
    setBanner("");merge();
  },()=>setBanner("予定を読み込めませんでした。ページを開き直してください。"));
  memoList=[];
  if(isBoss())unsubMemo=onSnapshot(q("memos"),s=>{memoList=s.docs.map(d=>Object.assign({id:d.id,col:"memos"},d.data()));merge();},()=>{});
}

/* ---------- 起動 ---------- */
let fbApp=null;
renderPeople();renderAll();
(async()=>{
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){setBanner("まだ設定がすんでいません（firebase-config.js）。");return;}
  try{
    const app=initializeApp(FIREBASE_CONFIG);fbApp=app;
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=getFirestore(app);}
    const auth=getAuth(app);
    await signInAnonymously(auth);uid=auth.currentUser.uid;
    const m=await getDoc(doc(fs,"members",uid));
    if(!m.exists())await askPin();
  }catch(e){fs=null;setBanner("予定表につながりません。電波を確認して、ページを開き直してください。");return;}
  try{const ed=await getDoc(doc(fs,"editors",uid));if(ed.exists())editor=ed.data().name||"";}catch(e){}
  applyEditor();                         // ここで予定（西崎さんはメモも）を読みはじめる
  // 携帯への通知（予定が入った・変わったとき 2026/10/31）
  renderPushBox({box:$("pushbox"),app:fbApp,fs,name:myName,pickName:then=>{pickMe();const t=setInterval(()=>{if(myName()){clearInterval(t);then();}else if($("scrim").hidden)clearInterval(t);},300);},h,toast});
  if(!editor&&!me)setTimeout(()=>{if(!me&&$("scrim").hidden)pickMe();},400);
  // 現場の一覧（在庫と同じ。施工中・これからの現場）
  onSnapshot(collection(fs,"sites"),s=>{sites=s.docs.map(d=>d.data()).filter(x=>x&&x.name&&x.active!==false&&x.status!=="見積もり")  /* 見積もり中の現場は出さない */.sort((a,b)=>(a.order||0)-(b.order||0));
    const r=s.docs.find(d=>d.id==="_yotei");loadRemembered(r?r.data():null);},()=>{});
})();
})();
