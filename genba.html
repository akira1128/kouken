<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>現場一覧｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 現場一覧：今通っている現場の情報（住所・元請・入場ルール・作業のコツ）、材料を頼む、注文の記録と集計。色と文字は在庫・予定表と同じ */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --low:#b0322d; --low-soft:#fbdfdd; --in:#0d7a52; --in-soft:#d8f0e6; --out:#93650d; --out-soft:#fbeecd; --nx:#6d28d9; --nx-soft:#ede5fc;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --in:#3fbe8b; --in-soft:#0e3527; --out:#d6a341; --out-soft:#382a0d; --nx:#b18cf5; --nx-soft:#271a45;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --in:#3fbe8b; --in-soft:#0e3527; --out:#d6a341; --out-soft:#382a0d; --nx:#b18cf5; --nx-soft:#271a45;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  margin:0;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
.brandrow .back{display:grid;justify-items:center;align-content:center;flex:none;min-width:44px;height:46px;margin:-4px -2px -4px -8px;border-radius:10px;
  background:rgba(255,255,255,.16);line-height:1;padding:0 5px 3px}
/* 戻るボタン：「‹」の下に、どこへ戻るか（TOP）を書く（2026/10/28 ユーザー） */
.brandrow .back b{font-size:26px;font-weight:400;line-height:.9}
.brandrow .back .backlbl{font-size:10.5px;font-weight:700;letter-spacing:.06em}
a.brandrow:active .back{background:rgba(255,255,255,.3)}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.06em;white-space:nowrap}
.brand{min-width:0;overflow:hidden}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:inherit;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.who b{opacity:.78;font-weight:400;font-size:11px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--out-soft);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:15px;padding:10px 14px}
.btn.small{width:auto;padding:7px 12px;font-size:14px}
.btn.danger{background:var(--low);color:#fff}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .btn{flex:1}
/* お知らせ（新しい注文） */
.notice{padding:12px 14px;display:grid;gap:8px;border-color:var(--low);background:var(--low-soft)}
.notice h3{margin:0;font-size:15px;color:var(--low)}
.notice .btn{justify-self:start;width:auto}
/* 現場の一覧 */
.sitecard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 14px}
.sitecard:first-of-type{border-top:0}
.sitecard b{font-size:16px;overflow-wrap:anywhere}
.sitecard .sub{grid-column:1/2;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sitecard .go{grid-row:1/3;grid-column:2;color:var(--muted);font-size:22px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:2px}
/* 状態の札：色をはっきり分ける（施工中＝緑、これから＝青、予定＝オレンジの点線）2026/10/28 ユーザー */
.st.now{background:var(--in);color:#fff}
.st.next{background:var(--nx);color:#fff}
/* マンションのマーク：ベランダの帯と階段の棟がある建物の絵（西崎さんの画像 IMG_2510.PNG と同じ形）＋部屋数 */
.mk{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:12px;font-weight:700;margin-right:6px;vertical-align:-4px;white-space:nowrap}
.mk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linejoin:miter;stroke-linecap:butt}
.dhead h2 .mk{font-size:14px}.dhead h2 .mk svg{width:24px;height:24px}
.units{width:72px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.st.plan{background:var(--surface);color:var(--out);border:1.5px dashed var(--out);padding:0 7px}
.stseg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.stseg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.stseg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.st.other{background:var(--bg);color:var(--muted)}
/* 外注の会社（例：竹内工業が施工中）。予定表の竹内工業と同じ色 */
.outs{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#fde7ec;color:#be123c;margin-right:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .outs{background:#3b1520;color:#f48aa2}}
.grouph{margin:0;padding:10px 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.grouph small{font-size:12px;font-weight:500;opacity:.8}
.grouph::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor;flex:none}
/* 状態ごとのまとまり：見出しの色と、左の太い線 */
.grp-now{border-left:5px solid var(--in)} .grp-now .grouph{color:var(--in);background:var(--in-soft)}
/* これから：アプリの青と分けるため紫 */
.grp-next{border-left:5px solid var(--nx)} .grp-next .grouph{color:var(--nx);background:var(--nx-soft)}
.grp-plan{border-left:5px dashed var(--out)} .grp-plan .grouph{color:var(--out);background:var(--out-soft)}
.grp-plan .grouph::before{background:none;border:2px dashed currentColor;width:9px;height:9px}
.grp-other{border-left:5px solid var(--line)} .grp-other .grouph{color:var(--muted);background:var(--bg)}
.grp-plan .sitecard b{color:var(--muted)}
/* 進行状況のメーター：いまの階／最上階。％は出さない。中身は流れるしま模様と光 2026/10/28 ユーザー */
.meter{display:grid;gap:6px;margin:2px 0 4px}
.meter .mh{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.mone{display:grid;gap:4px}.mone+.mone{margin-top:4px}
.meter .mh .tw{font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.meter .mh .fl{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.meter .mh .fl b{font-size:22px;color:var(--in);font-weight:700;margin:0 1px}
.mtrack{position:relative;height:22px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mfill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;overflow:hidden;
  background:linear-gradient(90deg,#0b7a50,#16a36b 60%,#34d399);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.mfill::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 9px,transparent 9px 18px);background-size:25.4px 100%;animation:mstripe .9s linear infinite}
.mfill::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:mshine 2.6s ease-in-out infinite}
.mticks{position:absolute;inset:0;display:flex;pointer-events:none}
.mticks i{flex:1;border-right:1px solid rgba(255,255,255,.35)}.mticks i:last-child{border:0}
@keyframes mstripe{to{background-position:25.4px 0}}
@keyframes mshine{0%{left:-40%}60%,100%{left:110%}}
@media (prefers-reduced-motion:reduce){.mfill::before,.mfill::after{animation:none}.mfill{transition:none}}
/* 満タン（最上階まで終わった）：金色のメーター・紙ふぶき・職人がジャンプ 2026/10/30 ユーザー */
.mone.done .mfill{background:linear-gradient(90deg,#b45309,#f59e0b 55%,#fde047)}
.mone.done .mtrack{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.25),0 0 14px rgba(245,158,11,.45)}
.mconf{position:absolute;right:0;bottom:30px;width:0;height:0;pointer-events:none}
.mconf i{position:absolute;left:0;top:0;width:7px;height:10px;border-radius:2px;background:var(--c);opacity:0;
  animation:mconf 1.3s cubic-bezier(.15,.7,.3,1) forwards;animation-delay:var(--d)}
@keyframes mconf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.runner.jump svg,.runner.jump .rface{animation:rjump .42s ease-in-out 3}
@keyframes rjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.mconf{display:none}.runner.jump svg,.runner.jump .rface{animation:none}}
/* メーターの上を走る人（黄色いヘルメットの職人）。メーターの先っぽについていく */
.mwrap{position:relative;padding-top:40px}.mwrap.fc{padding-top:54px}
/* 走る位置は走る人そのものを translateX（px）で動かす。left だと顔写真の層とずれてカクつき、
   メーター幅の帯を動かすと画面の外にはみ出してスマホの表示がくずれるため 2026/10/29 */
.runner{position:absolute;left:0;bottom:21px;width:38px;height:40px;margin-left:-22px;color:var(--ink);pointer-events:none;
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1);will-change:transform}
.runner svg{display:block;width:100%;height:100%;overflow:visible;animation:rbob .32s ease-in-out infinite alternate}
.runner .lim path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.runner .leg{stroke:#1f3550;stroke-width:3.4}.runner .arm{stroke:#0b5cab;stroke-width:2.8}.runner .body{stroke:#0b5cab;stroke-width:5}
.runner .la{transform-origin:14.5px 19px;animation:rleg .32s ease-in-out infinite alternate}
.runner .lb{transform-origin:14.5px 19px;animation:rleg .32s ease-in-out infinite alternate-reverse}
.runner .aa{transform-origin:17px 12px;animation:rarm .32s ease-in-out infinite alternate-reverse}
.runner .ab{transform-origin:17px 12px;animation:rarm .32s ease-in-out infinite alternate}
@keyframes rleg{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
@keyframes rarm{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
@keyframes rbob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
/* 顔写真は SVG とは別の img（体と同じリズムで上下）。transform だけで動かすので携帯でもなめらか */
.runner .rface{position:absolute;left:9px;top:-13px;width:28px;height:28px;pointer-events:none;
  animation:rbob .32s ease-in-out infinite alternate;-webkit-user-drag:none}
.runner svg.over{position:absolute;left:0;top:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.runner svg,.runner .la,.runner .lb,.runner .aa,.runner .ab,.runner .rface{animation:none}.runner{transition:none}}
.mstep{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted)}
.mstep .mby{margin-right:auto;font-size:11.5px}
/* ウレタン前・後の札とウレタン後のメーターの色 */
.meter .mh .ka{font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;background:#dcfce7;color:#166534}
.meter .mh .ka.a{background:#e0e7ff;color:#3730a3}
.meter .mh .ka.p{background:#fef3c7;color:#92400e;font-size:13px}
.mone.part{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.mone.part .mfill{background:linear-gradient(90deg,#0e7490,#06b6d4 60%,#67e8f9)}
.ptot{display:inline-flex;gap:6px;align-items:center}
.mone.part.done .mfill{background:linear-gradient(90deg,#b45309,#f59e0b 55%,#fde047)}
/* ウレタン後のメーターの出し入れ（高さを伸ばしながらふわっと出す・しまう） */
.mone.appear{animation:mappear .45s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
@keyframes mappear{from{max-height:0;opacity:0;transform:translateY(-6px)}to{max-height:220px;opacity:1;transform:none}}
.mone.vanish{animation:mvanish .32s ease-in both;overflow:hidden}
@keyframes mvanish{from{max-height:220px;opacity:1}to{max-height:0;opacity:0;margin:0;padding:0}}
@media (prefers-reduced-motion:reduce){.mone.appear,.mone.vanish{animation:none}}
.mone.after .mfill{background:linear-gradient(90deg,#3730a3,#6366f1 60%,#a5b4fc)}
.lastv{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:2px 0 8px;font-size:14px}
.lastv .lvl{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.lastv:empty{display:none}
.mtog{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:2px}
.pask{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--ink)}.pask[hidden]{display:none}.pask:not([hidden]){animation:mappear .3s cubic-bezier(.2,.8,.2,1) both}.pask .btn{min-width:56px}.mtog .btn{font-size:12.5px;padding:6px 10px;width:auto}
.mstep button{min-width:40px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;font-weight:700;color:var(--ink)}
/* 現場の詳しい画面 */
.dhead{padding:14px;display:grid;gap:10px}
.dhead h2{margin:0;font-size:19px;overflow-wrap:anywhere}
.backlink{justify-self:start;display:inline-flex;align-items:center;gap:2px;border:0;background:var(--bg);border-radius:10px;padding:6px 14px 6px 8px;min-height:40px;font-size:15px;font-weight:700;color:var(--accent)}
.backlink b{font-size:26px;line-height:1;font-weight:400;margin-top:-3px}
.sec{padding:12px 14px;display:grid;gap:10px}
.sec h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:14.5px}
.info dt{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:1px}
.info dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.info dd.none{color:var(--muted)}
/* この現場に行った人（予定表から） */
.visits{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.visits li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--bg);font-size:14.5px}
.visits li b{min-width:6.4em}
.visits .memo{flex-basis:100%;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.visits .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#fbeecd;color:#93650d}
.visits.next li{background:var(--surface);border-style:dashed}
.vsum{font-size:13.5px;margin:0 0 8px}.vsum b{font-size:15px}
h4.vh{margin:14px 0 6px;font-size:13px;color:var(--muted)}
.vwho{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.vwho li{display:flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);font-size:13.5px}
.vwho small{color:var(--muted);font-size:11.5px}
/* 現場の写真（材料置き場など）：小さく並べて、タップで大きく */
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 10px}
.phgrid button{position:relative;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg)}
.phgrid img{display:block;width:100%;height:100%;object-fit:cover}
.phgrid span{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;font-size:11px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phbig{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:8px;background:#000}
.phrow{display:flex;gap:8px}.phrow .btn{flex:1}
.btn.warn{background:#b42318}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);display:grid;gap:4px}
.notes .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.notes .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.notes .del{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px}
/* 注文 */
.order{border-top:1px solid var(--line);padding:11px 14px;display:grid;gap:5px}
.order:first-child{border-top:0}
.order .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.order .top b{color:var(--ink);font-size:14.5px;overflow-wrap:anywhere}
.order ul{margin:0;padding-left:1.2em;font-size:14.5px}
.order .mm{font-size:13px;color:var(--muted);white-space:pre-wrap}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--in-soft);color:var(--in);white-space:nowrap}
.dayh{margin:0;padding:10px 14px 2px;font-size:13px;font-weight:700;color:var(--muted);border-top:1px solid var(--line)}
.dayh:first-child{border-top:0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
table.sum{width:100%;border-collapse:collapse;font-size:14.5px}
table.sum th,table.sum td{padding:8px 14px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.sum td.n{text-align:right;white-space:nowrap;font-weight:700}
table.sum th{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg)}
table.sum tr.dayh th{font-size:14px;color:var(--ink);background:var(--accent-soft)}
table.sum tr.dayh .dest{margin-left:10px;font-size:12px;font-weight:500;color:var(--muted)}
/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* 下から出るパネル */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,18,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetback{position:sticky;top:-18px;z-index:2;justify-self:start;display:inline-flex;align-items:center;gap:2px;margin:-8px 0 -6px -6px;
  border:0;background:var(--bg);border-radius:10px;padding:6px 14px 6px 8px;min-height:40px;font-size:15px;font-weight:700;color:var(--accent);box-shadow:var(--shadow)}
.sheetback b{font-size:26px;line-height:1;font-weight:400;margin-top:-3px}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{margin:0;font-size:19px;overflow-wrap:anywhere}
form.f{display:grid;gap:12px}
label.fl{display:grid;gap:5px;font-size:14px;font-weight:700}
label.fl em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.err{color:var(--low);font-weight:700;font-size:14px;margin:0}
.names{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 6px;font-size:15px;font-weight:700}
.names button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <a class="brandrow home" href="./" aria-label="メニューにもどる"><span class="back" aria-hidden="true"><b>‹</b><span class="backlbl">TOP</span></span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">現場一覧<small>株式会社コウケン</small></div></a>
  <button class="who" id="whoBtn" type="button" aria-label="使う人を変える"><b>使う人</b><span id="whoName">名前をえらぶ</span></button>
</div></header>
<div class="wrap">
  <p class="banner" id="banner" hidden></p>
  <main>
    <section class="panel notice" id="notice" aria-live="polite" hidden></section>
    <div id="vSites"></div>
    <div id="vSite" hidden></div>
    <div id="vOrders" hidden></div>
    <div id="vSum" hidden></div>
  </main>
</div>
<nav class="tabs" aria-label="画面の切りかえ">
  <button type="button" data-v="vSites" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>現場</button>
  <button type="button" data-v="vOrders"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>注文の記録</button>
  <button type="button" data-v="vSum"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>集計</button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,updateDoc,getDoc,setDoc,onSnapshot,query,where,orderBy,limit,arrayUnion,arrayRemove,writeBatch,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";
(function(){
/* 社員：[正式名, 呼び名]。在庫・予定表と同じ。「使う人」は在庫で選んだ名前（kouken-who）と同じものを使う */
const STAFF=[["西崎剣","西崎"],["原田弓子","原田"],["福島正純","福島"],["田中嗣音","嗣穏"],["NGUYEN VAN HIEU","ヒエウ"],["DANG BINH DUONG","ズオン"],["NGUYEN NGOC LONG","ロン"]];
const NICK=Object.fromEntries(STAFF);
const nick=n=>NICK[n]||n||"";
/* 現場の情報の欄：[キー, 見出し, 入れ方の例] */
const FIELDS=[["address","住所","例：東京都八王子市明神町4-1"],
  // 最寄り駅と、現場までの行き方（電車・バス・徒歩）2026/10/28 ユーザー
  ["station","最寄り駅","例：京王線 京王八王子駅（徒歩5分くらい）"],["route","現場までの行き方","例：京王八王子駅の北口を出て、歩いて5分"],["parking","駐車場・搬入","例：現場前に2台。搬入は北側ゲートから"],
  ["gc","元請","例：株式会社エステック"],["outsource","外注（施工する会社）","例：竹内工業"],["contact","担当者","例：佐藤さん（設備）"],["tel","電話","例：090-1234-5678"],
  ["rules","入場ルール","例：朝礼8:00、新規入場は前日までに書類"],["caution","注意事項","例：17時以降は音の出る作業ダメ"],
  // 建物・時期・数量・仕様・進行状況も、現場の情報に入れる（2026/10/28 ユーザー）
  ["building","建物","例：10階・81部屋（A棟・B棟）"],["period","時期","例：2026年11月くらい？"],["volume","数量のめやす","例：配管 4,518m"],
  ["spec","保温の仕様","例：EA 1m ALK24K/25tロール＋亀甲金網"],["progress","進行状況","例：キッチンの結び 10階まで終わり"],
  // 予定表で使っている現場の呼び方。「この現場に行った人」を探すのに使う（2026/10/29）
  ["yotei","予定表での呼び方","例：大和田、大和田町（、で区切る）"]];
const LONG=new Set(["route","parking","rules","caution","building","spec","progress"]);
/* 現場の状態。「予定」はまだ決まっていない現場（どれにするかは西崎さんが決める 2026/10/28） */
const STATUSES=["施工中","これから","予定","終わった"];
const STATUS_ORDER={"施工中":0,"これから":1,"予定":2};
const MK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.6h18"/><path d="M15.9 20.6V3.4h3.7v17.2"/><path d="M4.7 5.8v14.8"/>'+
  '<path d="M4.2 4.6h11.7v1.3H4.2zM4.2 8.1h11.7v1.3H4.2zM4.2 11.6h11.7v1.3H4.2zM4.2 15.1h11.7v1.3H4.2z"/>'+
  '<g fill="currentColor" stroke="none"><rect x="6.9" y="6.5" width="1.5" height="1"/><rect x="9.9" y="6.5" width="1.5" height="1"/><rect x="12.9" y="6.5" width="1.5" height="1"/>'+
  '<rect x="6.9" y="10" width="1.5" height="1"/><rect x="9.9" y="10" width="1.5" height="1"/><rect x="12.9" y="10" width="1.5" height="1"/>'+
  '<rect x="6.9" y="13.5" width="1.5" height="1"/><rect x="9.9" y="13.5" width="1.5" height="1"/><rect x="12.9" y="13.5" width="1.5" height="1"/>'+
  '<rect x="17.3" y="5.9" width="0.9" height="1.5"/><rect x="17.3" y="9.5" width="0.9" height="1.5"/><rect x="17.3" y="13" width="0.9" height="1.5"/></g>'+
  '<path d="M9.8 20.6v-3.3h4.5v3.3M12.05 17.3v3.3"/></svg>';
const mark=x=>{if(!x.mansion)return null;const e=h("span",{class:"mk",title:"マンション","aria-label":"マンション"+(x.units?" "+x.units+"戸":"")});
  e.innerHTML=MK;if(x.units)e.append(x.units+"戸");return e;};
const stClass=st=>st==="施工中"?"now":st==="これから"?"next":st==="予定"?"plan":"other";
const shortSite=s=>(s||"").replace(/[（(]仮称[）)]\s*/g,"").replace(/\s*新築工事$/,"").trim();

const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
let toastT;function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function setBanner(msg){$("banner").textContent=msg||"";$("banner").hidden=!msg;}
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const WD="日月火水木金土";
const md=s=>{const [y,m,d]=s.split("-").map(Number);return m+"/"+d+"（"+WD[new Date(y,m-1,d).getDay()]+"）";};
const fmtN=n=>{n=Number(n)||0;return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)};
const hm=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());};

let fs=null, uid="", editor="", sites=[], orders=[], view="vSites", siteId=new URLSearchParams(location.search).get("site")||"";
let who=store("kouken-who")||"";
if(who&&!NICK[who])who="";

/* ---------- 下から出るパネル ---------- */
function openSheet(...kids){
  const s=$("scrim");s.replaceChildren(h("div",{class:"sheet",role:"dialog","aria-modal":"true"},kids));s.hidden=false;
  const close=()=>{s.hidden=true;s.replaceChildren();};
  s.onclick=e=>{if(e.target===s)close();};
  s.firstChild.prepend(h("button",{type:"button",class:"sheetback","aria-label":"もどる",onclick:close},h("b",{text:"‹"}),"戻る"));
  return close;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden&&$("scrim").onclick){$("scrim").hidden=true;$("scrim").replaceChildren();}});

/* ---------- 使う人 ---------- */
function renderWho(){$("whoName").textContent=editor?nick(editor):who?nick(who):"名前をえらぶ";}
function pickWho(then){
  const close=openSheet(h("h2",{text:"あなたはだれですか？"}),h("p",{class:"hint",text:"書いたメモや頼んだ材料に、この名前が残ります。この携帯に覚えておきます。"}),
    h("div",{class:"names"},STAFF.map(([n,k])=>h("button",{type:"button","aria-pressed":String(n===who),onclick:()=>{who=n;store("kouken-who",n);renderWho();close();then&&then();}},k))));
}
$("whoBtn").addEventListener("click",()=>{if(!editor)pickWho();});
const me=()=>editor||who;
const needWho=then=>{if(me())then();else pickWho(then);};

/* ---------- 画面の切りかえ ---------- */
function show(v){
  view=v;
  for(const id of ["vSites","vSite","vOrders","vSum"])$(id).hidden=id!==v;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===(v==="vSite"?"vSites":v)?"page":"false"));
  render();window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.v==="vSites")siteId="";show(b.dataset.v);}));
function openSite(id){rollRunFace();for(const k in meterW)if(k.startsWith(id+"/"))delete meterW[k];siteId=id;history.replaceState(null,"","?site="+encodeURIComponent(id));show("vSite");}
function render(){
  if(view==="vSites")renderSites();else if(view==="vSite")renderSite();else if(view==="vOrders")renderOrders();else renderSum();
  renderNotice();
}
const siteName=id=>{const s=sites.find(x=>x.id===id);return s?s.name:"";};

/* ---------- 現場の一覧（施工中・これから・そのほか） ---------- */
function renderSites(){
  const box=$("vSites");
  if(!sites.length){box.replaceChildren(h("div",{class:"panel empty",text:fs?"現場がまだありません":"読み込んでいます…"}));return;}
  const groups=[["施工中","",x=>x.status==="施工中","now"],["これから","",x=>x.status==="これから","next"],["予定","まだ決まっていない",x=>x.status==="予定","plan"],["そのほか","",x=>!(x.status in STATUS_ORDER),"other"]];
  // 外注が施工している現場は、まとまりのいちばん下に出す（2026/10/28 ユーザー）
  const outs=x=>!!(x.info&&x.info.outsource);
  box.replaceChildren(...groups.filter(([,,f])=>sites.some(f)).map(([t,sub,f,k])=>{const arr=sites.filter(f).sort((a,b)=>outs(a)-outs(b));
    return h("section",{class:"panel grp-"+k,style:{marginBottom:"14px"}},h("h3",{class:"grouph"},t+"　"+arr.length+"件",sub?h("small",{text:"（"+sub+"）"}):null),arr.map(x=>{
      const inf=x.info||{}, nOrd=orders.filter(o=>o.siteId===x.id).length, nNote=(x.notes||[]).length;
      return h("button",{type:"button",class:"sitecard",onclick:()=>openSite(x.id)},
        h("b",null,mark(x),h("span",{class:"st "+stClass(x.status),text:x.status||"―"}),shortSite(x.name)),
        h("span",{class:"go",text:"›"}),
        h("span",{class:"sub"},inf.outsource?h("span",{class:"outs",text:inf.outsource+"が"+(x.status==="施工中"?"施工中":"施工")}):null,
          [inf.address||"住所はまだ",nNote?"メモ "+nNote+"件":"",nOrd?"注文 "+nOrd+"回":""].filter(Boolean).join("　")));
    }));}));
}

/* ---------- 進行状況のメーター（floors＝最上階、floor＝いまの階）。階を変えるのは編集する人だけ ---------- */
const meterW={};
// ウレタン後のメーターを足した・消したときに、なめらかに出し入れするための印
const meterAppear=new Set();
// 走る人をメーターの w％ の位置へ（px で transform）。jump のときはアニメーションなしで置く
// 満タンのお祝い：メーターの右はしから紙ふぶき、職人がジャンプ
function celebrate(wrap,run){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#f59e0b","#ef4444","#3b82f6","#10b981","#a855f7","#fde047","#ec4899"];
  const box=h("div",{class:"mconf"});
  for(let i=0;i<28;i++){
    const a=(200+Math.random()*130)*Math.PI/180, d=50+Math.random()*70;
    box.append(h("i",{style:{"--c":cols[i%cols.length],"--x":Math.round(Math.cos(a)*d)+"px","--y":Math.round(Math.sin(a)*d)+"px",
      "--r":Math.round(Math.random()*720-360)+"deg","--d":Math.round(Math.random()*120)+"ms"}}));
  }
  wrap.append(box);run.classList.add("jump");
  setTimeout(()=>{box.remove();run.classList.remove("jump");},1700);
}
function placeRunner(run,w,jump){
  const W=run.parentElement?run.parentElement.clientWidth:0;
  if(jump){run.style.transition="none";run.style.transform="translateX("+(W*w/100)+"px)";void run.offsetWidth;run.style.transition="";}
  else run.style.transform="translateX("+(W*w/100)+"px)";
}
// 画面の向きや幅が変わったら、走る人を今の位置に置き直す
addEventListener("resize",()=>document.querySelectorAll(".runner[data-w]").forEach(r=>placeRunner(r,+r.dataset.w,true)));
// 走る人の絵：右へ走る。足と腕は CSS でふる
const RUN_ARMS='<path class="ab arm" d="M17 12.5L13.5 16L10.5 15"/><path class="aa arm" d="M17 12.5L20.5 16L23.5 13.5"/>';
const runnerSVG=face=>'<svg viewBox="0 0 30 32"><g class="lim">'+
  '<path class="lb leg" d="M14.5 19L11 24.5L6.5 26.5"/>'+(face?'':'<path class="ab arm" d="M17 12.5L13.5 16L10.5 15"/>')+
  '<path class="body" d="M17.2 11.5L14.8 18.5"/>'+
  '<path class="la leg" d="M14.5 19L18.5 24.5L17 30.3"/>'+(face?'':'<path class="aa arm" d="M17 12.5L20.5 16L23.5 13.5"/>')+'</g>'+
  (face?'':
     '<circle cx="18.3" cy="6.6" r="3.5" fill="#f2c9a0"/>'+
     '<path d="M14.4 6.3A3.9 3.9 0 0 1 22.2 6.3Z" fill="#f5b301" stroke="#b07f00" stroke-width=".6"/><path d="M21.8 6.3h2.2" stroke="#b07f00" stroke-width="1.3" stroke-linecap="round"/>')+'</svg>'+
  // サプライズの顔：背景を透明にした顔写真。SVG の中で描くとカクつくので、別の img にして動かす
  // 腕は顔写真に隠れないよう、写真の上に重ねた別の SVG に描く（2026/10/29 ユーザー）
  (face?'<img class="rface" src="'+face+'" alt=""><svg class="over" viewBox="0 0 30 32"><g class="lim">'+RUN_ARMS+'</g></svg>':'');
/* サプライズ：現場の画面を開くたびにくじを引く。西崎さん 5%・ヒエウ 5%・ズオン 5% でその人の顔が走る（2026/10/30 ユーザー）（写真が何枚かあればランダム）
   顔写真は faces/{名前} の imgs（背景を透明にした PNG。暗証番号を入れた携帯だけ読める）。
   最初に全員分を読んでおき、くじはその場で引く（後から描き直すと走りがやり直しになってカクつくため） */
const FACE_LUCK=[["西崎",.05],["ヒエウ",.05],["ズオン",.05]];
let runFace="", runFacePick=0;
const faceImgs={}, faceDecoded=[];
async function loadFaces(){
  await Promise.all(FACE_LUCK.map(async([n])=>{
    try{const d=await getDoc(doc(fs,"faces",n));faceImgs[n]=d.exists()?d.data().imgs||[]:[];}catch(e){faceImgs[n]=[];}
    for(const src of faceImgs[n]){const i=new Image();i.src=src;faceDecoded.push(i);if(i.decode)i.decode().catch(()=>{});}
  }));
}
function rollRunFace(){
  let r=Math.random(),who="";
  for(const [n,p] of FACE_LUCK){if(r<p){who=n;break;}r-=p;}
  const imgs=who&&faceImgs[who]||[];
  runFace=imgs.length?imgs[Math.floor(Math.random()*imgs.length)]:"";
  // 棟が分かれてメーターが何本かあっても、顔写真は1人だけ（どの棟で走るかもくじで決める）
  runFacePick=Math.random();
}
/* マンションの共用部・外部屋上のメーター（2026/10/30 ユーザー）。見込み人工はだれでも入れられ、あとで変えられる。入れた人の名前を出す。人工は1人工きざみ
   データ：x.parts.kyo／x.parts.okujo＝{total:見込み人工, totalBy, totalAt, done:済み人工, by, at} */
// 共用部・外部屋上は複数にできる（2026/10/30 ユーザー）。数は x.kyoCount／x.okujoCount、2つ目からは parts.kyo2・okujo2…、名前は「共用部2」「外部屋上2」
const PART_KINDS=[["kyo","共用部","kyoCount"],["okujo","外部屋上","okujoCount"]];
function partMeters(x){
  if(!x.mansion)return [];

/* 集計：「届いた材料（材料屋さんの請求書）」と「アプリで頼んだ材料」を分けて出す。金額は出さない（2026/10/29 ユーザー）
   請求書の材料は deliveries（請求書1枚＝1件、lines：d 日付・t 納入先・n 品名・s 規格・q 数量・u 単位） */

let deliv=null, unDeliv=null;
function watchDeliv(){
  if(unDeliv||!fs)return;
  unDeliv=onSnapshot(collection(fs,"deliveries"),s=>{
    const a=[];s.docs.forEach(d=>{const x=d.data();(x.lines||[]).forEach(l=>a.push(Object.assign({sup:x.supplier||""},l)));});
    // 古い請求書と新しい請求書で書き方がちがう（規格の末尾m・テープの本／巻）ので、同じ材料は新しい請求書の書き方にそろえる
    const kn=l=>(l.n||"").replace(/[\s　]/g,"")+"|"+(l.s||"").replace(/[\s　]/g,"").replace(/[mMｍ]$/,"");
    const best={};for(const l of a){const k=kn(l);if(!best[k]||(l.d||"")>(best[k].d||""))best[k]=l;}
    for(const l of a){const b=best[kn(l)];l.n=b.n;l.s=b.s;l.u=b.u;}

  },()=>{unDeliv=null;deliv=deliv||[];if(view==="vSum")renderSum();});  // 読めなかったときは、次に集計を開いたときに読み直す

function destOf(x){const k=siteKeys(x), nz=t=>(t||"").replace(/[\s　]/g,"");
  return t=>{t=nz(t);return (k.core&&t.includes(nz(k.core)))||k.alias.some(a=>t.includes(nz(a)))||k.full.some(f=>f&&t.includes(nz(shortSite(f))));};}

function renderSumInv(box,seg){
  watchDeliv();

    h("optgroup",{label:"請求書の納入先（新しい順）"},dests.map(t=>h("option",{value:"t:"+t,selected:"t:"+t===sumDest},t))));
  const mSel=h("select",{class:"inp","aria-label":"期間",onchange:e=>{sumMonth=e.target.value;renderSum();}},

  const sSel=sups.length>1?h("select",{class:"inp","aria-label":"材料屋さん",style:{gridColumn:"1 / -1"},onchange:e=>{sumSup=e.target.value;renderSum();}},
    h("option",{value:""},"すべての材料屋さん"),sups.map(v=>h("option",{value:v,selected:v===sumSup},v))):null;
  const days=new Set(list.map(l=>l.d)).size;
  box.replaceChildren(h("section",{class:"panel"},seg,
    h("div",{class:"tools"},dSel,mSel,sSel),
    h("p",{class:"hint",style:{padding:"0 14px 8px"},text:"納品 "+days+"日　材料 "+rows.length+"種類（"+(sups.join("・")||"材料屋さん")+"の請求書から）"}),
    // 「日にちごと」（届いた日に分ける）と「材料ごとの合計」を切りかえ（2026/10/30 ユーザー）
    h("div",{class:"stseg",style:{padding:"0 14px 8px"}},[["day","日にちごと"],["item","材料ごとの合計"]].map(([k,t])=>h("button",{type:"button","aria-pressed":String(sumBy===k),
      onclick:()=>{sumBy=k;store("kouken-sum-by",k);renderSum();}},t))),
    !list.length?h("p",{class:"empty",text:"この期間に届いた材料はありません"}):

      h("tbody",null,rows.map(([k,n])=>{const [name,size,unit]=k.split("|");
        return h("tr",null,h("td",null,name,size?h("small",{style:{display:"block",color:"var(--muted)"},text:size}):null),h("td",{class:"n",text:fmtN(n)+unit}));})))));

// 届いた日ごとに分けた表（新しい日が上）。すべての現場のときは納入先も出す

  try{
    const app=initializeApp(FIREBASE_CONFIG);
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=getFirestore(app);}
    const auth=getAuth(app);
    await signInAnonymously(auth);uid=auth.currentUser.uid;
    const m=await getDoc(doc(fs,"members",uid));
    if(!m.exists())await askPin();
  }catch(e){fs=null;setBanner("つながりません。電波を確認して、ページを開き直してください。");return;}
  try{const ed=await getDoc(doc(fs,"editors",uid));if(ed.exists())editor=ed.data().name||"";}catch(e){}
  renderWho();
  const facesP=loadFaces();
  if(siteId){await facesP;rollRunFace();}
  // 現場（在庫・予定表と同じ一覧。施工中→これから→そのほか）
  onSnapshot(collection(fs,"sites"),s=>{
    sites=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x&&x.name&&x.active!==false)
      .sort((a,b)=>((STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9))||(a.order||0)-(b.order||0));
    render();
  },()=>setBanner("現場を読み込めませんでした。ページを開き直してください。"));
  // 注文（新しい順に500件まで）
  onSnapshot(query(collection(fs,"orders"),orderBy("at","desc"),limit(500)),s=>{
    orders=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();
  },()=>{});
  // 予定表（だれがどの現場に行ったか）。変わったら「この現場に行った人」の欄だけ直す
  onSnapshot(collection(fs,"events"),s=>{
    events=s.docs.map(d=>d.data());
    const vb=$("visitBox"), x=sites.find(t=>t.id===siteId);if(view==="vSite"&&vb&&x)fillVisits(vb,x);
    const lv=$("lastVisit");if(view==="vSite"&&lv&&x)fillLastVisit(lv,x);
  },()=>{});
  if(!editor&&!who)setTimeout(()=>{if(!who&&$("scrim").hidden)pickWho();},400);
})();
})();
</script>
