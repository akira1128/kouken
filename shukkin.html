<!doctype html>
<html lang="ja" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>出勤日数｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* 出勤日数（パソコン用。原田さんのメニュー＝NAS share「⭐️harada（保管）」から開く。アプリのメニューには出さない 2026/11/07 ユーザー）
   予定表（events）から数える。現場が入っている日を1日（「工場（加工）」も1日、「休み」は数えない）。同じ日に2つ入っていても1日。
   開けるのは editors に登録した西崎さん・原田さんだけ。西崎さん一人だけの予定は memos にあり西崎さんしか読めないので、西崎さんが開いたときだけ数に入る。 */
:root{--bg:#eaf1f8;--surface:#fff;--line:#cbdaea;--ink:#0d1a27;--muted:#465b70;--accent:#0b5cab;--soft:#dceafa;--zero:#9aa9b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--accent);color:#fff}
header div{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:21px}
select{font:inherit;font-size:16px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:20px}
.lock{max-width:560px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.lock b{display:block;font-size:19px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;overflow-x:auto}
h2{margin:0 0 10px;font-size:18px}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:14px;color:var(--muted);font-weight:700}
thead th button{font:inherit;color:var(--accent);background:none;border:0;padding:2px 6px;border-radius:6px;cursor:pointer}
thead th button[aria-pressed="true"]{background:var(--accent);color:#fff}
td.z{color:var(--zero)}
td.sel,th.sel{background:var(--soft)}
td.tot,th.tot{font-weight:700;border-left:2px solid var(--line)}
tr.grp td{background:#f3f7fb;color:var(--muted);font-size:13px;font-weight:700;text-align:left}
.days{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}
.days span{font-size:13px;background:var(--soft);border-radius:6px;padding:1px 6px}
.det td{text-align:left;white-space:normal;vertical-align:top}
.det td.n{text-align:right;font-weight:700;white-space:nowrap}
.note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div><h1>出勤日数</h1><label>年 <select id="year" aria-label="年"></select></label></div></header>
<main id="main" hidden>
  <section class="panel">
    <h2 id="ttl">月ごとの出勤日数</h2>
    <p class="note">月の名前を押すと、その月の日付が下に出ます。</p>
    <table><thead id="head"></thead><tbody id="body"></tbody></table>
  </section>
  <section class="panel">
    <h2 id="dttl"></h2>
    <table class="det"><tbody id="det"></tbody></table>
  </section>
  <p class="note" id="foot">
    数え方：社長のアプリの予定表で、現場が入っている日を1日と数えます（「工場（加工）」も1日、「休み」は数えません。同じ日に2つの現場でも1日）。<br>
    予定表を直すと、このページを開き直したときに反映されます。
  </p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,query,where,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";

/* 予定表（yotei.html）と同じ名前。原田さんは予定に入れないので出さない */
const STAFF=[["西崎剣","西崎"],["福島正純","福島"],["田中嗣音","嗣穏"],["NGUYEN VAN HIEU","ヒエウ"],["DANG BINH DUONG","ズオン"],["NGUYEN NGOC LONG","ロン"]];
const OUTS=[["竹内工業","竹内工業"],["高橋断熱","高橋断熱"],["小原興業","小原興業"],["コウケン板金","コウケン板金"]];
const OFF="休み", BOSS="西崎剣", EDITORS=["西崎剣","原田弓子"];
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 予定の一覧から、人ごと・日ごとの「行った現場」を作る：days[人][日付]=[現場…] */
export function countDays(evs,year){
  const a=year+"-01-01", b=year+"-12-31", days={};
  for(const e of evs){
    if(!e||e.deleted||!e.date||(e.site||"")===OFF)continue;
    const end=e.end&&e.end>=e.date?e.end:e.date;
    if(end<a||e.date>b)continue;
    for(let d=parse(e.date<a?a:e.date);;d.setDate(d.getDate()+1)){
      const s=ymd(d);if(s>end||s>b)break;
      for(const p of e.people||[]){
        const m=(days[p]||(days[p]={}));
        (m[s]||(m[s]=[])).push(e.site||"（現場なし）");
      }
    }
  }
  return days;
}
window.countDays=countDays;

const now=new Date();
let year=now.getFullYear(), month=now.getMonth()+1, fs=null, isBoss=false, data={};
const ysel=$("year");
for(let y=now.getFullYear()+1;y>=2026;y--){const o=document.createElement("option");o.value=y;o.textContent=y+"年";ysel.appendChild(o);}
ysel.value=year;
ysel.onchange=async()=>{year=+ysel.value;month=year===now.getFullYear()?now.getMonth()+1:1;await load();};

function render(){
  const row=([n,k])=>{
    const m=data[n]||{};let tot=0;
    const cells=[];
    for(let i=1;i<=12;i++){const pre=year+"-"+p2(i)+"-";const c=Object.keys(m).filter(s=>s.startsWith(pre)).length;tot+=c;
      cells.push(`<td class="${c?"":"z"}${i===month?" sel":""}">${c?c+"日":"0"}</td>`);}
    return `<tr><td>${esc(k)}</td>${cells.join("")}<td class="tot">${tot}日</td></tr>`;
  };
  $("head").innerHTML="<tr><th>名前</th>"+Array.from({length:12},(_,i)=>`<th class="${i+1===month?"sel":""}"><button type="button" data-m="${i+1}" aria-pressed="${i+1===month}">${i+1}月</button></th>`).join("")+'<th class="tot">年の合計</th></tr>';
  $("body").innerHTML='<tr class="grp"><td colspan="14">社員</td></tr>'+STAFF.map(row).join("")+'<tr class="grp"><td colspan="14">外注さん</td></tr>'+OUTS.map(row).join("");
  $("head").querySelectorAll("button").forEach(b=>b.onclick=()=>{month=+b.dataset.m;render();});
  $("ttl").textContent=year+"年　月ごとの出勤日数";
  // えらんだ月の日付
  const pre=year+"-"+p2(month)+"-";
  $("dttl").textContent=year+"年"+month+"月に行った日";
  $("det").innerHTML=[...STAFF,...OUTS].map(([n,k])=>{
    const ds=Object.keys(data[n]||{}).filter(s=>s.startsWith(pre)).sort();
    return `<tr><td style="width:7em">${esc(k)}</td><td class="n" style="width:4em">${ds.length}日</td><td><div class="days">${
      ds.length?ds.map(s=>`<span title="${esc(data[n][s].join("・"))}">${+s.slice(8)}日</span>`).join(""):'<span style="background:none;color:var(--zero)">なし</span>'}</div></td></tr>`;
  }).join("");
}

async function load(){
  const a=(year-1)+"-10-31", b=year+"-12-31";   // 前の年から続く予定も読む
  const q=c=>query(collection(fs,c),where("date",">=",a),where("date","<=",b),orderBy("date"));
  const evs=(await getDocs(q("events"))).docs.map(d=>d.data());
  if(isBoss)try{evs.push(...(await getDocs(q("memos"))).docs.map(d=>d.data()));}catch(e){}
  data=countDays(evs,year);
  render();
}

const main=$("main");
const msg=document.createElement("div");msg.className="lock";msg.innerHTML="<b>確かめています…</b>";main.before(msg);
try{
  const app=initializeApp(FIREBASE_CONFIG);
  const auth=getAuth(app);await signInAnonymously(auth);
  fs=getFirestore(app);
  const ed=await getDoc(doc(fs,"editors",auth.currentUser.uid));
  const name=ed.exists()?ed.data().name:"";
  if(!EDITORS.includes(name)){
    msg.innerHTML='<b>このページは、西崎さんと原田さんだけが開けます</b><span>先にこのパソコンで<a href="yotei.html">予定表</a>を開き、いちばん下の「編集する人はこちら」で名前をえらんで、編集用の番号を入れてください（1回だけ）。そのあと、このページを開き直してください。</span>';
  }else{
    isBoss=name===BOSS;
    if(!isBoss)$("foot").insertAdjacentHTML("beforeend","<br>西崎さんが自分一人だけで入れた予定は西崎さんのメモになるため、原田さんの画面では西崎さんの日数に入りません。");
    await load();msg.remove();main.hidden=false;
  }
}catch(e){
  msg.innerHTML='<b>読み込めませんでした</b><span>インターネットにつながっているか確認して、開き直してください。</span>';
}
</script>
</body>
</html>
