<!doctype html>
<html lang="ja" translate="no" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>アクセス履歴｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 便利ツール（2026/11/01 ユーザー）。ツールはここにカードで足していく */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.06em}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
.brandrow .back{display:grid;justify-items:center;align-content:center;flex:none;min-width:44px;height:46px;margin:-4px -2px -4px -8px;border-radius:10px;
  background:rgba(255,255,255,.16);line-height:1;padding:0 5px 3px}
.brandrow .back b{font-size:26px;font-weight:400;line-height:.9}
.brandrow .back .backlbl{font-size:10.5px;font-weight:700;letter-spacing:.06em}
a.brandrow:active .back{background:rgba(255,255,255,.3)}
main{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:16px 14px;text-decoration:none;color:inherit;min-height:120px}
a.card:active{transform:scale(.98)}
.card .ic{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{font-size:17px}
.card span{font-size:12.5px;color:var(--muted);line-height:1.45}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.lock{max-width:640px;margin:40px auto;padding:0 16px;display:grid;gap:10px;justify-items:center;text-align:center;color:var(--muted)}
.lock b{font-size:18px;color:var(--ink)}
.lock a{margin-top:6px;display:inline-block;padding:10px 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.who{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font:inherit;text-align:left;color:inherit;cursor:pointer}
.who[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.who b{display:block;font-size:15px}
.who small{display:block;font-size:12px;color:var(--muted)}
.who .old{color:#b42318}
h2{font-size:14px;color:var(--muted);margin:16px 2px 8px;letter-spacing:.06em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row:last-child{border-bottom:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.row .d{font-size:11.5px;color:var(--muted);text-align:right}
.day{background:var(--bg);padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brandrow" href="nishizaki.html" aria-label="西崎専用にもどる"><span class="back" aria-hidden="true"><b>‹</b><span class="backlbl">もどる</span></span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">アクセス履歴<small>西崎さんだけ</small></div></a>
</div></header>
<main id="main" hidden>
  <p class="note" style="margin:0 2px 10px">社員がアプリを見た日時と画面です（同じ携帯・同じ画面は30分に1回だけ記録）。名前を押すとその人だけ出します。</p>
  <div class="sum" id="sum"></div>
  <div id="out"><div class="list"><div class="empty">読み込んでいます…</div></div></div>
</main>
<script type="module" src="boss-only.js"></script>
<script type="module">
/* アクセス履歴（2026/11/02 ユーザー）。logins を新しい順に500件読む。西崎さんだけ読める（firestore.rules） */
import {getApps} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const NICK={"西崎剣":"西崎","原田弓子":"原田","福島正純":"福島","田中嗣音":"嗣穏","NGUYEN VAN HIEU":"ヒエウ","DANG BINH DUONG":"ズオン","NGUYEN NGOC LONG":"ロン"};
const STAFF=["福島正純","田中嗣音","NGUYEN VAN HIEU","DANG BINH DUONG","NGUYEN NGOC LONG","原田弓子","西崎剣"];
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,"0"), W="日月火水木金土";
const dstr=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+"（"+W[d.getDay()]+"）";};
const tstr=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());};
const dev=ua=>/iPhone/.test(ua)?"iPhone":/iPad/.test(ua)?"iPad":/Android/.test(ua)?"Android":/Macintosh/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[], pick="";
function render(){
  const now=Date.now(), wk=now-7*864e5;
  const names=[...new Set([...STAFF,...all.map(x=>x.who||"（名前なし）")])].filter(n=>STAFF.includes(n)||all.some(x=>(x.who||"（名前なし）")===n));
  $("sum").innerHTML=names.map(n=>{const a=all.filter(x=>(x.who||"（名前なし）")===n);const last=a[0];const c=a.filter(x=>x.at>=wk).length;
    const old=!last||now-last.at>3*864e5;
    return `<button type="button" class="who" data-n="${esc(n)}" aria-pressed="${pick===n}"><b>${esc(NICK[n]||n)}</b><small class="${old?"old":""}">${last?"最後 "+dstr(last.at)+" "+tstr(last.at):"記録なし"}</small><small>7日間で ${c}回</small></button>`;}).join("");
  document.querySelectorAll(".who").forEach(b=>b.onclick=()=>{pick=pick===b.dataset.n?"":b.dataset.n;render();});
  const rows=all.filter(x=>!pick||(x.who||"（名前なし）")===pick);
  if(!rows.length){$("out").innerHTML='<div class="list"><div class="empty">まだ記録がありません</div></div>';return;}
  let h="",day="";
  rows.forEach(x=>{const d=dstr(x.at);if(d!==day){h+=`<div class="day">${d}</div>`;day=d;}
    h+=`<div class="row"><span class="t">${tstr(x.at)}</span><span><b>${esc(NICK[x.who]||x.who||"（名前なし）")}</b>　${esc(x.page||"")}</span><span class="d">${dev(x.ua||"")}${x.home?"・アプリ":""}</span></div>`;});
  $("out").innerHTML=`<h2>${pick?esc(NICK[pick]||pick)+"の履歴":"すべての履歴"}（${rows.length}件）</h2><div class="list">${h}</div>`;
}
(async()=>{
  for(let i=0;i<60&&$("main").hidden;i++)await new Promise(r=>setTimeout(r,300));   // 西崎さんと分かってから読む
  if($("main").hidden)return;
  try{const s=await getDocs(query(collection(getFirestore(getApps()[0]),"logins"),orderBy("at","desc"),limit(500)));all=s.docs.map(d=>d.data());render();}
  catch(e){$("out").innerHTML='<div class="list"><div class="empty">読めませんでした（'+esc(e.code||e.message||"")+'）</div></div>';}
})();
</script>
<script type="module" src="log.js"></script>
</body>
</html>
