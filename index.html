<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 株式会社コウケンアプリのトップ（メニュー）。機能はここにカードで増やしていく。色と文字は原田さんの勤怠台帳に合わせる */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.mark{display:block;width:44px;height:40px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.14em}
main{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:16px 14px;text-decoration:none;min-height:132px}
a.card:active{transform:scale(.98)}
.card .ic{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card b{font-size:17px}
.card span{font-size:12.5px;color:var(--muted);line-height:1.45}
.card.soon{opacity:.6;box-shadow:none}
.card.soon .tag{justify-self:start;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card .tag.kari{justify-self:start;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#fbeecd;color:#93650d}
.card.add{border-style:dashed;background:transparent;box-shadow:none;place-content:center;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <span class="mark"><img src="logo.png" alt="コウケンのロゴ"></span>
  <div class="brand">株式会社コウケン<small>社内アプリ</small></div>
</div></header>
<main>
  <h1>メニュー</h1>
  <div class="grid">
    <!-- 機能はここにカードで足していく -->
    <a class="card" href="zaiko.html">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5v11H3z"/><path d="M8 20v-6h8v6"/></svg></span>
      <b>工場在庫</b>
      <span>材料の入庫・持ち出し・在庫の数</span>
    </a>
    <a class="card" href="yotei.html">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <b>予定表</b>
      <span>現場の予定・だれがどこへ</span>
    </a>
    <div class="card add">
      <span>＋<br>これから機能を<br>増やしていきます</span>
    </div>
  </div>
  <p class="note">株式会社コウケン 社内用。リンクと暗証番号は社外の人に教えないでください。</p>
</main>
</body>
</html>
