<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>予定表｜株式会社コウケン</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="コウケン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 社員の予定表（LINE WORKSのカレンダーの代わり）。上に月のカレンダー、下にえらんだ日の予定。入れる・直すのは西崎さんと原田さんだけ。色と文字は在庫と同じ */
:root{
  color-scheme:light;
  --bg:#eaf1f8; --surface:#ffffff; --line:#cbdaea; --ink:#0d1a27; --muted:#465b70;
  --accent:#0b5cab; --accent-ink:#ffffff; --accent-soft:#dceafa;
  --low:#b0322d; --low-soft:#fbdfdd; --sat:#0b5cab; --today:#fbeecd;
  --shadow:0 1px 2px rgba(10,40,70,.07);
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --sat:#6fb0f0; --today:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111b; --surface:#0f1c2a; --line:#25394f; --ink:#e6eff8; --muted:#a1b5ca;
  --accent:#4c9ae8; --accent-ink:#04121f; --accent-soft:#12314f;
  --low:#e8756e; --low-soft:#3b1a18; --sat:#6fb0f0; --today:#382a0d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  margin:0;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header.topbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
a.brandrow{color:inherit;text-decoration:none}
.brandrow .back{font-size:30px;line-height:1;font-weight:400;margin-right:-4px;opacity:.85}
.mark{display:block;width:40px;height:36px;border-radius:9px;background:#fff;padding:3px 4px;flex:none}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;opacity:.78;letter-spacing:.14em}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.who b{opacity:.78;font-weight:400;font-size:11px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--today);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
/* 月の切りかえ */
.month{display:grid;grid-template-columns:44px 1fr 44px auto;align-items:center;gap:6px;padding:8px 8px 4px}
.month h2{margin:0;text-align:center;font-size:19px}
.month button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;font-size:20px}
.month .tday{font-size:13px;padding:0 10px;font-weight:700}
/* 人でしぼる */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px 6px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .wd.sun{color:var(--low)} .cal .wd.sat{color:var(--sat)}
.day{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:76px;border:0;border-top:1px solid var(--line);background:none;padding:3px 2px 4px;text-align:left}
.day .n{font-size:12px;font-weight:700;line-height:1;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex:none}
.day.sun .n,.day.hol .n{color:var(--low)} .day.sat .n{color:var(--sat)}
.day.out{opacity:.38}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"]{background:var(--accent-soft);border-radius:6px}
.chip{display:block;font-size:10px;line-height:1.45;padding:0 3px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:500}
.more{font-size:10px;color:var(--muted);padding-left:2px;line-height:1.2}
/* えらんだ日の予定 */
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 6px}
.dhead h3{margin:0;font-size:17px}
.dhead .hn{font-size:12px;color:var(--low);font-weight:700;margin-left:6px}
.evs{list-style:none;margin:0;padding:0 0 4px}
.ev{display:grid;grid-template-columns:6px 1fr;gap:0 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px}
.ev .bar{grid-row:1/5;border-radius:3px}
.ev .st{font-weight:700;overflow-wrap:anywhere}
.ev .pp{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ev .pp span{font-size:13px;padding:1px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.ev .pp span.me{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.ev .mm{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.ev .span{font-size:12px;color:var(--muted)}
.empty{padding:20px 14px 24px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}
.foot button{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:12px;padding:6px}
/* 下の「予定を入れる」 */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.addbar .btn{max-width:608px;margin:0 auto;display:block}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:15px;padding:10px 14px}
.btn.danger{background:var(--low);color:var(--surface)}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1}
/* 下から出るパネル */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,18,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:19px}
form.f{display:grid;gap:14px}
label.fl,.fl{display:grid;gap:6px;font-size:14px;font-weight:700}
.fl em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
textarea.inp{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--low);font-weight:700;font-size:14px;margin:0}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 4px;font-size:15px;font-weight:700}
.names button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <a class="brandrow home" href="./" aria-label="メニューにもどる"><span class="back" aria-hidden="true">‹</span><span class="mark"><img src="logo.png" alt=""></span><div class="brand">予定表<small>株式会社コウケン</small></div></a>
  <span class="who" id="who"><b>見るだけ</b></span>
</div></header>
<div class="wrap">
  <p class="banner" id="banner" hidden></p>
  <main>
    <section class="panel">
      <div class="month">
        <button type="button" id="prev" aria-label="前の月">‹</button>
        <h2 id="mTitle"></h2>
        <button type="button" id="next" aria-label="次の月">›</button>
        <button type="button" class="tday" id="tday">今日</button>
      </div>
      <div class="chips" id="people" role="toolbar" aria-label="人でしぼる" style="padding:0 8px 8px"></div>
      <div class="cal" id="cal"></div>
    </section>
    <section class="panel" aria-live="polite">
      <div class="dhead"><h3 id="dTitle"></h3><span class="hint" id="dCount"></span></div>
      <ul class="evs" id="evs"></ul>
    </section>
    <p class="foot">予定を入れる・直すのは西崎・原田だけです。<button type="button" id="editLogin" hidden>編集する人はこちら</button></p>
  </main>
</div>
<div class="addbar" id="addbar" hidden><button class="btn" type="button" id="addBtn">＋ 予定を入れる</button></div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,updateDoc,deleteDoc,getDoc,setDoc,onSnapshot,query,where,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";
(function(){
/* 社員：[正式名, 呼び名]。在庫（zaiko.html）と同じ。予定には正式名を残す（あとで人工の集計に使う） */
const STAFF=[["西崎剣","西崎"],["原田弓子","原田"],["福島正純","福島"],["田中嗣音","嗣穏"],["NGUYEN VAN HIEU","ヒエウ"],["DANG BINH DUONG","ズオン"],["NGUYEN NGOC LONG","ロン"]];
const NICK=Object.fromEntries(STAFF);
const nick=n=>NICK[n]||n||"";
/* 予定を入れられる人 */
const EDITORS=["西崎剣","原田弓子"];
const FACTORY="工場（加工）", OFF="休み", OTHER="その他（下に書く）";
/* 祝日（2026・2027年。振替休日・国民の休日を含む）。2028年からは足す */
const HOLI={"2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",
  "2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日",
  "2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日","2027-04-29":"昭和の日",
  "2027-05-03":"憲法記念日","2027-05-04":"みどりの日","2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日","2027-09-20":"敬老の日",
  "2027-09-23":"秋分の日","2027-10-11":"スポーツの日","2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"};
/* 現場の色。白い文字が読める濃さ。現場名から決まるので、いつも同じ色になる */
const COLORS=["#1f6fc5","#c2410c","#15803d","#7c3aed","#be185d","#0e7490","#4d7c0f","#9f1239","#b45309","#4338ca"];
function colorOf(site){
  if(site===OFF)return "#64748b";
  if(site===FACTORY)return "#a16207";
  let x=0;for(const c of site||"")x=(x*31+c.charCodeAt(0))>>>0;
  return COLORS[x%COLORS.length];
}
/* カレンダーのマスに出す短い現場名 */
const shortSite=s=>(s||"").replace(/[（(]仮称[）)]\s*/g,"").replace(/\s*新築工事$/,"").replace(/^株式会社|株式会社$/g,"").trim();

const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
let toastT;function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function setBanner(msg){$("banner").textContent=msg||"";$("banner").hidden=!msg;}

/* 日付は "2026-11-09" の文字で持つ（並べ替え・比べるのがかんたん） */
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const WD="日月火水木金土";
const md=s=>{const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）";};
const todayS=()=>ymd(new Date());

let fs=null, uid="", editor="", events=[], sites=[], unsub=null;
let sel=todayS();
let ym=sel.slice(0,7);                    // 表示している月 "2026-11"
let person=store("kouken-yotei-person")||"すべて";
if(person!=="すべて"&&!NICK[person])person="すべて";

/* ---------- 人でしぼる ---------- */
function renderPeople(){
  $("people").replaceChildren(...[["すべて","すべて"],...STAFF].map(([n,k])=>h("button",{type:"button","aria-pressed":String(n===person),
    onclick:()=>{person=n;store("kouken-yotei-person",n);renderPeople();renderCal();renderDay();}},k)));
}
const shown=()=>person==="すべて"?events:events.filter(e=>(e.people||[]).includes(person));
const onDay=(list,s)=>list.filter(e=>e.date<=s&&(e.end||e.date)>=s);

/* ---------- 月のカレンダー ---------- */
function gridRange(){
  const first=parse(ym+"-01");
  const start=new Date(first);start.setDate(1-first.getDay());
  const last=new Date(first.getFullYear(),first.getMonth()+1,0);
  const end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));
  return [ymd(start),ymd(end)];
}
function renderCal(){
  const [y,m]=ym.split("-").map(Number);
  $("mTitle").textContent=y+"年"+m+"月";
  const [a,b]=gridRange(), t=todayS(), list=shown();
  const cells=[...WD].map((w,i)=>h("div",{class:"wd"+(i===0?" sun":i===6?" sat":""),text:w}));
  for(let s=a;s<=b;s=addDays(s,1)){
    const d=parse(s), dow=d.getDay(), evs=onDay(list,s);
    const cls="day"+(dow===0?" sun":dow===6?" sat":"")+(HOLI[s]?" hol":"")+(s.slice(0,7)!==ym?" out":"")+(s===t?" today":"");
    const max=3;
    cells.push(h("button",{type:"button",class:cls,"aria-pressed":String(s===sel),"aria-label":md(s)+(HOLI[s]?" "+HOLI[s]:"")+" 予定"+evs.length+"件",
      onclick:()=>{sel=s;if(s.slice(0,7)!==ym){ym=s.slice(0,7);listen();}renderCal();renderDay();}},
      h("span",{class:"n",text:d.getDate()}),
      evs.slice(0,max).map(e=>h("span",{class:"chip",style:{background:colorOf(e.site)},text:shortSite(e.site)||e.memo||"予定"})),
      evs.length>max?h("span",{class:"more",text:"+"+(evs.length-max)}):null));
  }
  $("cal").replaceChildren(...cells);
}

/* ---------- えらんだ日の予定 ---------- */
function renderDay(){
  $("dTitle").replaceChildren(md(sel),HOLI[sel]?h("span",{class:"hn",text:HOLI[sel]}):"");
  const evs=onDay(shown(),sel).sort((x,y)=>(x.site||"").localeCompare(y.site||"","ja"));
  $("dCount").textContent=evs.length?evs.length+"件":"";
  if(!evs.length){$("evs").replaceChildren(h("li",{class:"empty",text:person==="すべて"?"予定はありません":nick(person)+"さんの予定はありません"}));return;}
  $("evs").replaceChildren(...evs.map(e=>{
    const body=[h("span",{class:"bar",style:{background:colorOf(e.site)}}),
      h("span",{class:"st",text:e.site||"（現場なし）"}),
      e.end&&e.end!==e.date?h("span",{class:"span",text:md(e.date)+" 〜 "+md(e.end)}):null,
      (e.people||[]).length?h("span",{class:"pp"},(e.people||[]).map(n=>h("span",{class:n===person?"me":null,text:nick(n)}))):null,
      e.memo?h("span",{class:"mm",text:e.memo}):null];
    return h("li",null,editor?h("button",{type:"button",class:"ev","aria-label":"この予定を直す",onclick:()=>openEdit(e)},body):h("div",{class:"ev"},body));
  }));
}

/* ---------- 月の切りかえ ---------- */
function moveMonth(n){
  const d=parse(ym+"-01");d.setMonth(d.getMonth()+n);ym=ymd(d).slice(0,7);
  const t=todayS();sel=t.slice(0,7)===ym?t:ym+"-01";
  listen();renderCal();renderDay();
}
$("prev").addEventListener("click",()=>moveMonth(-1));
$("next").addEventListener("click",()=>moveMonth(1));
$("tday").addEventListener("click",()=>{sel=todayS();ym=sel.slice(0,7);listen();renderCal();renderDay();});
// 横にすべらせても月を切りかえる
let sx=null,sy=0;
$("cal").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$("cal").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)moveMonth(dx<0?1:-1);},{passive:true});

/* ---------- 下から出るパネル ---------- */
function openSheet(...kids){
  const s=$("scrim");s.replaceChildren(h("div",{class:"sheet",role:"dialog","aria-modal":"true"},kids));s.hidden=false;
  const close=()=>{s.hidden=true;s.replaceChildren();};
  s.onclick=e=>{if(e.target===s)close();};
  return close;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden&&$("scrim").onclick){$("scrim").hidden=true;$("scrim").replaceChildren();}});

/* ---------- 予定を入れる・直す（西崎・原田だけ） ---------- */
function openEdit(ev,copy){
  const isNew=!ev||copy;
  const e=ev||{date:sel,end:"",people:[],site:"",memo:""};
  const picked=new Set(e.people||[]);
  const dIn=h("input",{class:"inp",type:"date",value:copy?addDays(e.date,1):e.date,required:true});
  const eIn=h("input",{class:"inp",type:"date",value:copy?"":(e.end&&e.end!==e.date?e.end:"")});
  const names=h("div",{class:"names",role:"group","aria-label":"だれが"},STAFF.map(([n,k])=>h("button",{type:"button","aria-pressed":String(picked.has(n)),
    onclick:ev2=>{picked.has(n)?picked.delete(n):picked.add(n);ev2.currentTarget.setAttribute("aria-pressed",String(picked.has(n)));}},k)));
  const known=[...sites.map(s=>s.name),FACTORY,OFF];
  const isOther=!!e.site&&!known.includes(e.site);
  const sSel=h("select",{class:"inp"},h("option",{value:""},"えらぶ"),
    ...sites.map(s=>h("option",{value:s.name,selected:s.name===e.site},s.name)),
    h("option",{value:FACTORY,selected:e.site===FACTORY},FACTORY),h("option",{value:OFF,selected:e.site===OFF},OFF),
    h("option",{value:OTHER,selected:isOther},OTHER));
  const oIn=h("input",{class:"inp",type:"text",placeholder:"現場の名前",value:isOther?e.site:"",hidden:!isOther});
  sSel.addEventListener("change",()=>{oIn.hidden=sSel.value!==OTHER;if(!oIn.hidden)oIn.focus();});
  const mIn=h("textarea",{class:"inp",placeholder:"例：8時現地集合、車は2台"},e.memo||"");
  const err=h("p",{class:"err",hidden:true});
  const save=h("button",{class:"btn",type:"submit"},isNew?"入れる":"直す");
  let close;
  const form=h("form",{class:"f",onsubmit:async x=>{x.preventDefault();
    const site=sSel.value===OTHER?oIn.value.trim():sSel.value;
    const date=dIn.value, end=eIn.value&&eIn.value!==date?eIn.value:"";
    const fail=m=>{err.textContent=m;err.hidden=false;};
    if(!date)return fail("日にちを入れてください。");
    if(end&&end<date)return fail("終わりの日が、はじめの日より前になっています。");
    if(!site&&!mIn.value.trim())return fail("現場をえらぶか、メモを書いてください。");
    const data={date,end,people:STAFF.map(s=>s[0]).filter(n=>picked.has(n)),site,memo:mIn.value.trim(),updatedAt:Date.now(),updatedBy:editor};
    save.disabled=true;err.hidden=true;
    try{
      if(isNew)await addDoc(collection(fs,"events"),{...data,createdAt:Date.now(),createdBy:editor});
      else await updateDoc(doc(fs,"events",e.id),data);
      close();sel=date;if(date.slice(0,7)!==ym){ym=date.slice(0,7);listen();}renderCal();renderDay();
      toast(isNew?"予定を入れました":"予定を直しました");
    }catch(y){fail(y&&y.code==="permission-denied"?"入れる権限がありません。":"保存できませんでした。電波を確認してください。");save.disabled=false;}
  }},
    h("h2",{text:isNew?(copy?"予定をコピー":"予定を入れる"):"予定を直す"}),
    h("div",{class:"two"},h("label",{class:"fl"},"日にち",dIn),h("label",{class:"fl"},h("span",null,"終わりの日 ",h("em",{text:"何日か続くとき"})),eIn)),
    h("div",{class:"fl"},h("span",null,"だれが ",h("em",{text:"何人でもえらべます"})),names),
    h("label",{class:"fl"},"現場",sSel,oIn),
    h("label",{class:"fl"},h("span",null,"メモ ",h("em",{text:"なくてもよい"})),mIn),
    err,save,
    !isNew?h("div",{class:"rowbtns"},
      h("button",{class:"btn ghost",type:"button",onclick:()=>{close();openEdit(e,true);}},"別の日にコピー"),
      h("button",{class:"btn ghost",type:"button",onclick:async b=>{
        const t=b.currentTarget;
        if(t.dataset.ok!=="1"){t.dataset.ok="1";t.className="btn danger";t.textContent="本当に消す";return;}
        t.disabled=true;
        try{await deleteDoc(doc(fs,"events",e.id));close();toast("予定を消しました");}
        catch(y){fail("消せませんでした。電波を確認してください。");t.disabled=false;}
      }},"消す")):null);
  close=openSheet(form);
}
$("addBtn").addEventListener("click",()=>openEdit(null));

/* ---------- 編集する人の登録（西崎・原田が最初に1回だけ。編集用の暗証番号をデータベース側で確かめる） ---------- */
function askEditPin(){
  let name=EDITORS[0];
  const names=h("div",{class:"names",style:{gridTemplateColumns:"1fr 1fr"}},EDITORS.map(n=>h("button",{type:"button","aria-pressed":String(n===name),
    onclick:x=>{name=n;names.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===nick(n))));}},nick(n))));
  const inp=h("input",{class:"inp",type:"password",inputmode:"numeric",autocomplete:"off",maxlength:"12","aria-label":"編集用の暗証番号",style:{fontSize:"28px",textAlign:"center",letterSpacing:".3em"}});
  const err=h("p",{class:"err",hidden:true});
  const go=h("button",{class:"btn",type:"submit"},"編集できるようにする");
  let close;
  const form=h("form",{class:"f",onsubmit:async e=>{e.preventDefault();
    const v=inp.value.trim();if(!v)return;
    go.disabled=true;err.hidden=true;
    try{await setDoc(doc(fs,"editors",uid),{pin:v,name,at:Date.now()});editor=name;close();applyEditor();toast(nick(name)+"さん、予定を入れられます");}
    catch(x){err.textContent=x&&x.code==="permission-denied"?"番号がちがいます。":"確認できませんでした。電波を確認してください。";err.hidden=false;go.disabled=false;inp.select();}
  }},h("h2",{text:"予定を入れる人の登録"}),h("p",{class:"hint",text:"西崎・原田だけ。この携帯で最初に1回だけ入れてください。"}),names,inp,err,go);
  close=openSheet(form);
}
$("editLogin").addEventListener("click",askEditPin);
function applyEditor(){
  $("who").replaceChildren(editor?h("b",{text:"入力"}):h("b",{text:"見るだけ"}),editor?nick(editor):"");
  $("addbar").hidden=!editor;$("editLogin").hidden=!!editor||!fs;
  renderDay();
}

/* ---------- 会社の暗証番号（在庫と同じ。もう入れた携帯は聞かない） ---------- */
function askPin(){
  return new Promise(resolve=>{
    const inp=h("input",{class:"inp",type:"password",inputmode:"numeric",autocomplete:"off",maxlength:"12","aria-label":"暗証番号",style:{fontSize:"28px",textAlign:"center",letterSpacing:".3em"}});
    const err=h("p",{class:"err",hidden:true});
    const go=h("button",{class:"btn",type:"submit"},"はじめる");
    const form=h("form",{class:"f",onsubmit:async e=>{e.preventDefault();
      const v=inp.value.trim();if(!v)return;
      go.disabled=true;go.textContent="確認しています…";err.hidden=true;
      try{await setDoc(doc(fs,"members",uid),{pin:v,at:Date.now()});$("scrim").hidden=true;$("scrim").replaceChildren();resolve();}
      catch(x){err.textContent=x&&x.code==="permission-denied"?"番号がちがいます。":"確認できませんでした。電波を確認してください。";err.hidden=false;go.disabled=false;go.textContent="はじめる";inp.select();}
    }},h("h2",{text:"会社の暗証番号"}),h("p",{class:"hint",text:"最初の1回だけ入れてください。この携帯に覚えておきます。"}),inp,err,go);
    openSheet(form);
    $("scrim").onclick=null;               // 番号を入れるまで閉じられない
  });
}

/* ---------- 予定を読む（表示している月のぶんだけ。何日も続く予定のため、2か月前から始まるものも読む） ---------- */
function listen(){
  if(!fs)return;
  if(unsub)unsub();
  const [a,b]=gridRange();
  unsub=onSnapshot(query(collection(fs,"events"),where("date",">=",addDays(a,-62)),where("date","<=",b),orderBy("date")),s=>{
    events=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(e=>(e.end||e.date)>=a);
    setBanner("");renderCal();renderDay();
  },()=>setBanner("予定を読み込めませんでした。ページを開き直してください。"));
}

/* ---------- 起動 ---------- */
renderPeople();renderCal();renderDay();
(async()=>{
  if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){setBanner("まだ設定がすんでいません（firebase-config.js）。");return;}
  try{
    const app=initializeApp(FIREBASE_CONFIG);
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){fs=getFirestore(app);}
    const auth=getAuth(app);
    await signInAnonymously(auth);uid=auth.currentUser.uid;
    const m=await getDoc(doc(fs,"members",uid));
    if(!m.exists())await askPin();
  }catch(e){fs=null;setBanner("予定表につながりません。電波を確認して、ページを開き直してください。");return;}
  try{const ed=await getDoc(doc(fs,"editors",uid));if(ed.exists())editor=ed.data().name||"";}catch(e){}
  applyEditor();
  listen();
  // 現場の一覧（在庫と同じ。施工中・これからの現場）
  onSnapshot(collection(fs,"sites"),s=>{sites=s.docs.map(d=>d.data()).filter(x=>x&&x.name&&x.active!==false).sort((a,b)=>(a.order||0)-(b.order||0));},()=>{});
})();
})();
</script>
